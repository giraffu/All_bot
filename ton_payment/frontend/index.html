<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>灵石充值</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .product-card {
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid transparent;
        }
        .product-card.selected {
            border-color: #0088cc;
            background-color: rgba(0, 136, 204, 0.1);
        }
        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #0088cc;
        }
        #ton-connect-button {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }
        #pay-button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            display: none;
        }
        #pay-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>灵石充值中心</h1>
        
        <!-- 连接钱包按钮 -->
        <div id="ton-connect-button"></div>
        
        <!-- 商品列表 -->
        <div id="products" style="display: none;">
            <div class="product-card" onclick="selectProduct(100, 1)">
                <h3>100 灵石</h3>
                <div class="product-price">1 TON</div>
            </div>
            <div class="product-card" onclick="selectProduct(550, 5)">
                <h3>550 灵石 (赠10%)</h3>
                <div class="product-price">5 TON</div>
            </div>
            <div class="product-card" onclick="selectProduct(1200, 10)">
                <h3>1200 灵石 (赠20%)</h3>
                <div class="product-price">10 TON</div>
            </div>
        </div>

        <!-- 支付按钮 -->
        <button id="pay-button" onclick="sendTransaction()">立即支付</button>
        
        <div id="status" class="status">请先连接钱包</div>
    </div>

    <script>
        // 初始化 TON Connect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://pay.aivison.it.com/tonconnect-manifest.json', // 这里需要替换成真实公网URL
            buttonRootId: 'ton-connect-button'
        });

        let selectedAmount = 0;
        let selectedPrice = 0;
        let userWalletAddress = null;

        // 监听钱包连接状态
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                userWalletAddress = wallet.account.address;
                document.getElementById('products').style.display = 'block';
                document.getElementById('status').innerText = '已连接: ' + formatAddress(userWalletAddress);
            } else {
                userWalletAddress = null;
                document.getElementById('products').style.display = 'none';
                document.getElementById('pay-button').style.display = 'none';
                document.getElementById('status').innerText = '请先连接钱包';
            }
        });

        function formatAddress(address) {
            return address.slice(0, 4) + '...' + address.slice(-4);
        }

        function selectProduct(amount, price) {
            // 清除旧选择
            document.querySelectorAll('.product-card').forEach(el => el.classList.remove('selected'));
            // 高亮新选择
            event.currentTarget.classList.add('selected');
            
            selectedAmount = amount;
            selectedPrice = price;
            
            const btn = document.getElementById('pay-button');
            btn.style.display = 'block';
            btn.innerText = `支付 ${price} TON 购买 ${amount} 灵石`;
        }

        async function sendTransaction() {
            if (!userWalletAddress || selectedPrice === 0) return;

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 600, // 10分钟有效
                messages: [
                    {
                        address: "UQAluW2wxRCDsJIKGH59jB07xODgEbStdUPEj9AjI88d9l-s", // 替换为您的收款地址
                        amount: (selectedPrice * 1000000000).toString(), // 转换为 nanotons
                        // payload: "..." // 可选：添加备注用于后端验证
                    }
                ]
            };

            try {
                const result = await tonConnectUI.sendTransaction(transaction);
                alert('交易发送成功！请等待确认。');
                // 这里应该调用后端API通知Bot检查交易
                // fetch('/api/verify_payment', { ... })
            } catch (e) {
                console.error(e);
                alert('交易取消或失败');
            }
        }
    </script>
</body>
</html>
