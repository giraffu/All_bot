<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · 本地数据分析平台</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --ink: #1d2433;
        --muted: #687083;
        --line: #d8dee8;
        --teal: #0f766e;
        --panel: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(29, 36, 51, 0.07);
      }

      .eyebrow {
        color: var(--teal);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        margin: 6px 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #4a5568;
        font-size: 12px;
        font-weight: 800;
      }

      input {
        width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        border: 1px solid #c7ceda;
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        background: var(--teal);
        color: white;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.72;
      }

      .error {
        min-height: 20px;
        color: #b42318;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">AllBot Shadow Analytics</div>
      <h1>本地数据分析平台</h1>
      <p>登录后访问只读 shadow 数据分析。</p>
      <form id="loginForm">
        <label>
          账号
          <input id="username" name="username" autocomplete="username" required autofocus />
        </label>
        <label>
          密码
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button id="submitButton" type="submit">登录</button>
        <div id="error" class="error" role="alert"></div>
      </form>
    </main>
    <script>
      const form = document.getElementById("loginForm");
      const errorBox = document.getElementById("error");
      const button = document.getElementById("submitButton");
      const params = new URLSearchParams(window.location.search);
      const nextPath = params.get("next") || "/";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.textContent = "";
        button.disabled = true;
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value,
              password: document.getElementById("password").value,
            }),
          });
          if (!response.ok) {
            errorBox.textContent = response.status === 401 ? "账号或密码不正确" : "登录服务暂不可用";
            return;
          }
          window.location.assign(nextPath.startsWith("/") ? nextPath : "/");
        } catch (_) {
          errorBox.textContent = "登录服务暂不可用";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
