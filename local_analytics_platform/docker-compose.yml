version: "3.8"

services:
  local-analytics-platform:
    build: .
    container_name: allbot-local-analytics-platform
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../prompts.ini:/app/prompts.ini:ro
      - ./data:/app/data
    environment:
      LOCAL_ANALYTICS_DATABASE_URL: ${LOCAL_ANALYTICS_DATABASE_URL:?LOCAL_ANALYTICS_DATABASE_URL is required}
      LOCAL_ANALYTICS_HOST: ${LOCAL_ANALYTICS_HOST:-0.0.0.0}
      LOCAL_ANALYTICS_PORT: ${LOCAL_ANALYTICS_PORT:-8098}
      LOCAL_ANALYTICS_MEDIA_BUCKET: ${LOCAL_ANALYTICS_MEDIA_BUCKET:-user-data-prod-shadow}
      LOCAL_ANALYTICS_MEDIA_PUBLIC_BASE_URL: ${LOCAL_ANALYTICS_MEDIA_PUBLIC_BASE_URL:-}
      LOCAL_ANALYTICS_AUTH_ENABLED: ${LOCAL_ANALYTICS_AUTH_ENABLED:-false}
      LOCAL_ANALYTICS_AUTH_USERNAME: ${LOCAL_ANALYTICS_AUTH_USERNAME:-}
      LOCAL_ANALYTICS_AUTH_PASSWORD_HASH: ${LOCAL_ANALYTICS_AUTH_PASSWORD_HASH:-}
      LOCAL_ANALYTICS_AUTH_PASSWORD: ${LOCAL_ANALYTICS_AUTH_PASSWORD:-}
      LOCAL_ANALYTICS_AUTH_SESSION_SECRET: ${LOCAL_ANALYTICS_AUTH_SESSION_SECRET:-}
      LOCAL_ANALYTICS_AUTH_COOKIE_SECURE: ${LOCAL_ANALYTICS_AUTH_COOKIE_SECURE:-false}
      LOCAL_ANALYTICS_AUTH_SESSION_TTL_SECONDS: ${LOCAL_ANALYTICS_AUTH_SESSION_TTL_SECONDS:-43200}
