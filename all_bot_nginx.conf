# 1. 定义 MinIO 的缓存区 (分配 10GB 硬盘空间用于缓存视频和图片)
proxy_cache_path /var/cache/nginx/minio_cache levels=1:2 keys_zone=minio_cache:10m max_size=25g inactive=7d use_temp_path=off;

# ==========================================
# Server: web.aivison.it.com (前端与 API)
# ==========================================
server {
    server_name web.aivison.it.com;
    
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://telegram.org;" always;

    # 设置最大上传限制为 5MB，解决 413 Request Entity Too Large
    client_max_body_size 50m;
    
    # 1. 托管前端静态页面
    location / {
        root /root/dist;
        try_files $uri $uri/ /index.html; # Vue Router History 模式支持
    }

    # 2. 代理 API 请求到武汉 FastAPI
    location /api/ {
        # 转发到武汉服务器的 Tailscale IP
        proxy_pass http://100.99.254.53:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # SSE (Server-Sent Events) 支持，防止进度条断开
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/web.aivison.it.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/web.aivison.it.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ==========================================
# Server: assets.aivison.it.com (纯 MinIO 存储/CDN)
# ==========================================
server {
    server_name assets.aivison.it.com;
    
    # 允许大文件上传
    client_max_body_size 50m;

    # 将 /bot-data/ 请求代理到 MinIO (兼容带 bucket 名的路径)
    location /bot-data/ {
        proxy_pass http://100.99.254.53:9000;
        
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 透传原始域名和真实IP，解决 MinIO 403 签名错误
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 启用缓存
        proxy_cache minio_cache;
        proxy_cache_valid 200 302 7d; # 成功响应缓存 7 天
        proxy_cache_valid 404 1m;     # 404 响应缓存 1 分钟
        
        # 增加缓存命中状态响应头，方便你 F12 调试是否命中缓存
        add_header X-Cache-Status $upstream_cache_status;
        
        # 优化大文件（视频）传输体验
        proxy_buffering on;
        proxy_ignore_headers Cache-Control Expires; # 强制忽略源站的防缓存头
    }

    # 将根路径 / 的请求也代理到 MinIO
    # (防止访问根路径时返回前端页面)
    location / {
        proxy_pass http://100.99.254.53:9000;
        
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 启用缓存
        proxy_cache minio_cache;
        proxy_cache_valid 200 302 7d;
        proxy_cache_valid 404 1m;
        
        add_header X-Cache-Status $upstream_cache_status;
        proxy_buffering on;
        proxy_ignore_headers Cache-Control Expires;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/web.aivison.it.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/web.aivison.it.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ==========================================
# HTTP -> HTTPS 重定向
# ==========================================
server {
    if ($host = assets.aivison.it.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = web.aivison.it.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name web.aivison.it.com assets.aivison.it.com;
    
    # 设置最大上传限制为 5MB，解决 413 Request Entity Too Large
    client_max_body_size 50m;
    return 404; # managed by Certbot
}
