version: '3.8'

services:
  dashboard-frontend:
    build:
      context: ./frontend
    # ports:
    #   - "8085:80"
    restart: always
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - dashboard-backend
    network_mode: "host"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 30s

  dashboard-backend:
    build:
      context: ../
      dockerfile: dashboard/backend/Dockerfile
    environment:
      # These will override the root .env for the dashboard specifically
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@192.168.1.115:5432/bot_db
      - MINIO_ENDPOINT=192.168.1.115:9000
      - MINIO_PUBLIC_URL=http://192.168.1.115:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - MINIO_BUCKET=bot-data
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - DASHBOARD_ADMIN_USERNAME=${DASHBOARD_ADMIN_USERNAME:?DASHBOARD_ADMIN_USERNAME is required}
      - DASHBOARD_ADMIN_PASSWORD_HASH=$$2b$$12$$YIySnXRqN4W6uLKgKUzSKe/V4g4JJEghmIdOcaW0UO21Fda5H05aa
      - DASHBOARD_SECRET_KEY=${DASHBOARD_SECRET_KEY:?DASHBOARD_SECRET_KEY is required}
      - REDIS_PREFIX=prod_bot_
      - REDIS_URL=redis://:redispassword@127.0.0.1:6379/1
      - WORKER_REDIS_URL=redis://:redispassword@127.0.0.1:6379/2
      - TZ=Asia/Shanghai
    # ports:
      # - "8043:8043" # Incompatible with network_mode: "host"
    restart: always
    volumes:
      # Optional: mount root .env if you want it to share with bot
      - ../.env:/app/.env
    # Use host network to allow access to host services like MinIO on 192.168.1.115
    network_mode: "host"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8043/api/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
