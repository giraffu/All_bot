# Cloud production edge template for /etc/nginx/sites-available/all_bot.
# Copy to the edge VPS only after backing up the current production config.
# Validate with: nginx -t before the formal maintenance window.
# Do not reload this file until the formal maintenance window.
#
# This template intentionally preserves assets.aivison.it.com as the legacy
# MinIO read path. RMB payment edge routing is split into
# all_bot_nginx_cloud_prod_rmb.conf because the current edge VPS does not yet
# have a rmb.aivison.it.com certificate.

proxy_cache_path /var/cache/nginx/minio_cache levels=1:2 keys_zone=minio_cache:10m max_size=25g inactive=7d use_temp_path=off;

# Server: web.aivison.it.com (frontend and cloud Web API)
server {
    server_name web.aivison.it.com;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://telegram.org;" always;

    client_max_body_size 50m;

    location / {
        root /root/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://100.107.220.127:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/web.aivison.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.aivison.it.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Server: assets.aivison.it.com (legacy MinIO read path)
server {
    server_name assets.aivison.it.com;

    server_tokens off;
    client_max_body_size 50m;

    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_max_temp_file_size 2048m;

    location /bot-data/ {
        proxy_pass http://100.99.254.53:9000;

        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache minio_cache;
        proxy_cache_valid 200 302 7d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_buffering on;
        proxy_ignore_headers Cache-Control Expires;

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://100.99.254.53:9000;

        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache minio_cache;
        proxy_cache_valid 200 302 7d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_buffering on;
        proxy_ignore_headers Cache-Control Expires;

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/web.aivison.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.aivison.it.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = assets.aivison.it.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = web.aivison.it.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name web.aivison.it.com assets.aivison.it.com;
    client_max_body_size 50m;
    return 404;
}
