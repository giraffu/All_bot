<!DOCTYPE html>
<html>
<head>
  <style>
    .ant-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f0f2f5;
    }
    .ant-layout-has-sider {
      flex-direction: row;
    }
    .ant-layout-sider {
      background: #001529;
      width: 200px;
    }
  </style>
</head>
<body>
  <div class="ant-layout ant-layout-has-sider">
    <div class="ant-layout-sider">
      <div style="height: 200px; background: red;">Menu</div>
    </div>
    <div class="ant-layout">
      <div style="height: 300px; background: green;">Content</div>
    </div>
  </div>
</body>
</html>
