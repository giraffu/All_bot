# ==========================================
# Server: web-test.aivison.it.com (测试前端与测试 Web API)
# 使用说明：
# 1. 先将静态文件同步到 /root/dist-test
# 2. 将本文件复制到边缘 VPS: /etc/nginx/sites-available/web-test.aivison.it.com
# 3. 建立 sites-enabled 软链后执行 nginx -t && nginx -s reload
# 4. 最后执行 certbot --nginx -d web-test.aivison.it.com
# ==========================================
server {
    listen 80;
    server_name web-test.aivison.it.com;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://telegram.org;" always;

    client_max_body_size 50m;

    location / {
        root /root/dist-test;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://100.107.220.127:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }
}
