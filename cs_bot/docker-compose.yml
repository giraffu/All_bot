version: '3.8'

services:
  cs-bot:
    build: .
    container_name: cs-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 重要：因为 LM Studio 运行在宿主机的 1234 端口
      # 容器内不能用 localhost，必须通过 host.docker.internal 访问宿主机
      - LLM_API_BASE=http://host.docker.internal:1234/v1
      # 如果宿主机有代理软件(如 Clash)，让容器也能使用宿主机的代理连 TG
      - PROXY_URL=${PROXY_URL}
    extra_hosts:
      # 允许容器通过 host.docker.internal 解析到宿主机 IP
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
