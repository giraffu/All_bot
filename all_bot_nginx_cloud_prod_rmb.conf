# Cloud production RMB edge template.
# Enable this only after rmb.aivison.it.com DNS/Cloudflare routing and the
# certificate below are prepared on the edge VPS. Do not include this file in
# the live Nginx config until the formal maintenance window.

server {
    server_name rmb.aivison.it.com;

    server_tokens off;
    client_max_body_size 10m;

    location / {
        proxy_pass http://100.107.220.127:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rmb.aivison.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmb.aivison.it.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = rmb.aivison.it.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name rmb.aivison.it.com;
    client_max_body_size 10m;
    return 404;
}
