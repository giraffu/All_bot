name: Build RunPod img2img Profile Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR tag. Leave empty to use <UTC date>-img2img-<short sha>."
        required: false
        default: ""
      base_image:
        description: "Base image for the baked img2img_lora runtime."
        required: false
        default: "yanwk/comfyui-boot:cu128-slim"
      comfyui_ref:
        description: "ComfyUI git ref used by the profile image."
        required: false
        default: "master"
      push_image:
        description: "Push the image to GHCR after build and smoke test."
        required: true
        type: boolean
        default: true
      verify_public_pull:
        description: "Verify anonymous GHCR manifest access after push."
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-img2img-profile-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: allbot-comfy-runpod-img2img
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and publish img2img profile
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby
          docker system prune -af || true
          df -h /

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ inputs.image_tag }}"
          if [[ -z "${tag}" ]]; then
            tag="$(date -u +%Y%m%d)-img2img-${GITHUB_SHA::7}"
          fi
          image_ref="ghcr.io/${owner}/${IMAGE_NAME}:${tag}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${image_ref}"

      - name: Login to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke test, and optionally push
        shell: bash
        env:
          ALLBOT_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(
            --profile img2img_lora
            --image-ref "${{ steps.meta.outputs.image_ref }}"
            --base-image "${{ inputs.base_image }}"
            --comfyui-ref "${{ inputs.comfyui_ref }}"
          )
          if [[ "${{ inputs.push_image }}" == "true" ]]; then
            args+=(--push)
          fi
          scripts/build_runpod_profile_image.sh "${args[@]}"

      - name: Verify baked revision labels
        shell: bash
        run: |
          set -euo pipefail
          labels="$(docker image inspect "${{ steps.meta.outputs.image_ref }}" --format '{{json .Config.Labels}}')"
          test "$(jq -r '."org.opencontainers.image.revision"' <<<"$labels")" = "${GITHUB_SHA}"
          test "$(jq -r '."io.allbot.runpod.agent-revision"' <<<"$labels")" = "${GITHUB_SHA}"
          test "$(jq -r '."io.allbot.runpod.workflow-revision"' <<<"$labels")" = "${GITHUB_SHA}"

      - name: Verify anonymous GHCR manifest access
        if: ${{ inputs.push_image && inputs.verify_public_pull }}
        shell: bash
        run: |
          set -euo pipefail
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          DOCKER_CONFIG="${tmp_docker_config}" docker manifest inspect "${{ steps.meta.outputs.image_ref }}" >/dev/null

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## RunPod img2img Profile Image"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image_ref }}\`"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Model manifest: \`img2img_lora/2026-06-10/manifest.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
