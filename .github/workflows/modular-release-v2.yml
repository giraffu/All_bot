name: Modular immutable release v2

on:
  workflow_run:
    workflows: ["Immutable control-plane release"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full trusted branch SHA to package.
        required: true
      release_channel:
        description: Immutable release channel.
        required: true
        type: choice
        options: [main]
        default: main
      gpu_manifest_ref:
        description: Optional OCI ref containing gpu-execution-manifest.json for this SHA.
        required: false
        default: ""
      validation_mode:
        description: Manual dispatch only creates build-only artifacts; full is emitted by a successful upstream test workflow.
        required: true
        type: choice
        options: [build-only]
        default: build-only

permissions:
  contents: read
  packages: write

concurrency:
  group: modular-release-v2-${{ github.event.workflow_run.head_sha || inputs.source_sha }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_CHANNEL: ${{ inputs.release_channel }}
          INPUT_VALIDATION_MODE: ${{ inputs.validation_mode }}
        run: |
          set -euo pipefail
          sha="${EVENT_SHA:-${INPUT_SHA:-}}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          branch="${EVENT_BRANCH:-}"
          channel="${INPUT_CHANNEL:-}"
          if [ -n "$branch" ]; then
            validation_mode=full
            case "$branch" in
              main) channel=main ;;
              *) echo "untrusted workflow_run branch: $branch" >&2; exit 2 ;;
            esac
          else
            validation_mode="${INPUT_VALIDATION_MODE:-full}"
            case "$channel" in
              main) branch=main ;;
              *) echo "invalid release channel" >&2; exit 2 ;;
            esac
            if [ "$validation_mode" != build-only ]; then
              echo "manual dispatch cannot claim full validation" >&2
              exit 2
            fi
          fi
          bundle_repository="${IMAGE_PREFIX}/allbot-release-v2"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "source_ref=refs/heads/$branch" >> "$GITHUB_OUTPUT"
          echo "bundle_repository=$bundle_repository" >> "$GITHUB_OUTPUT"
          echo "validation_mode=$validation_mode" >> "$GITHUB_OUTPUT"
          if [ -n "${EVENT_RUN_ID:-}" ]; then
            echo "ci_run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${EVENT_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "ci_run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - name: Verify trusted branch ancestry
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --prune origin "$SOURCE_BRANCH"
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/$SOURCE_BRANCH"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            dashboard/frontend/package-lock.json

      - name: Reject environment-owned build inputs
        run: python scripts/validate_release_environment_neutral.py

      - name: Resolve previous immutable bundle and changed paths
        id: previous
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_CHANNEL: ${{ steps.source.outputs.channel }}
          BUNDLE_REPOSITORY: ${{ steps.source.outputs.bundle_repository }}
        run: |
          set -euo pipefail
          comparison_sha="$(git rev-parse "${SOURCE_SHA}^")"
          previous_sha=""
          previous_repository=""
          repositories=("$BUNDLE_REPOSITORY")
          for repository in "${repositories[@]}"; do
            tags_file="available-$(echo "$repository" | tr '/:' '--').txt"
            oras repo tags "$repository" > "$tags_file" || continue
            while IFS= read -r candidate; do
              if grep -Fxq "$candidate" "$tags_file"; then
                previous_sha="$candidate"
                previous_repository="$repository"
                break
              fi
            done < <(git rev-list --first-parent "${SOURCE_SHA}^")
            [ -z "$previous_sha" ] || break
          done
          if [ -n "$previous_sha" ]; then
            mkdir -p previous-release
            oras pull "${previous_repository}:${previous_sha}" -o previous-release
            previous_bundle_dir=previous-release
            if [ -f previous-release/release-index.json ]; then
              :
            elif [ -f previous-release/release-v2/release-index.json ]; then
              previous_bundle_dir=previous-release/release-v2
            else
              echo "previous v2 bundle has no release-index.json" >&2
              exit 2
            fi
            comparison_sha="$previous_sha"
            echo "index=${previous_bundle_dir}/release-index.json" >> "$GITHUB_OUTPUT"
            echo "bundle=${previous_bundle_dir}" >> "$GITHUB_OUTPUT"
          else
            echo "index=" >> "$GITHUB_OUTPUT"
            echo "bundle=" >> "$GITHUB_OUTPUT"
          fi
          git diff --name-only "$comparison_sha" "$SOURCE_SHA" > changed-paths.txt

      - name: Build changed modules and assemble release index
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PREVIOUS_INDEX: ${{ steps.previous.outputs.index }}
          PREVIOUS_BUNDLE: ${{ steps.previous.outputs.bundle }}
          GPU_MANIFEST_REF: ${{ inputs.gpu_manifest_ref }}
          RELEASE_CHANNEL: ${{ steps.source.outputs.channel }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          TRUSTED_CI_RUN: ${{ steps.source.outputs.ci_run }}
          VALIDATION_MODE: ${{ steps.source.outputs.validation_mode }}
        run: |
          set -euo pipefail
          args=(
            --sha "$SOURCE_SHA"
            --ci-run "$TRUSTED_CI_RUN"
            --image-prefix "$IMAGE_PREFIX"
            --release-channel "$RELEASE_CHANNEL"
            --source-ref "$SOURCE_REF"
            --validation-mode "$VALIDATION_MODE"
            --changed-file changed-paths.txt
            --output-dir release-v2
          )
          if [ "$RELEASE_CHANNEL" = main ]; then
            args+=(--require-complete-gpu)
          fi
          gpu_manifest=""
          manifest_ref="${GPU_MANIFEST_REF:-${IMAGE_PREFIX}/allbot-gpu-release-manifests:${SOURCE_SHA}}"
          if oras manifest fetch "$manifest_ref" >/dev/null 2>&1; then
            mkdir -p gpu-manifest-input
            oras pull "$manifest_ref" -o gpu-manifest-input
            gpu_manifest="gpu-manifest-input/gpu-execution-manifest.json"
            test -f "$gpu_manifest"
          fi
          if [ -n "$PREVIOUS_INDEX" ]; then
            args+=(--previous-index "$PREVIOUS_INDEX" --previous-bundle-dir "$PREVIOUS_BUNDLE")
          fi
          if [ -n "$gpu_manifest" ]; then
            args+=(--gpu-manifest "$gpu_manifest")
          fi
          python scripts/ci_release_v2.py "${args[@]}"
          python scripts/release.py plan \
            --env test --track control-plane --sha "$SOURCE_SHA" \
            --from-sha "$SOURCE_SHA" --manifest release-v2/release-index.json \
            --skip-git-checks --skip-ci-checks --skip-env-checks

      - name: Smoke thin frontend entrypoints
        if: steps.source.outputs.validation_mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          dashboard_ref="$(jq -r '.artifacts["dashboard-frontend"].ref' release-v2/control-plane-manifest.json)"
          qqcc_ref="$(jq -r '.artifacts["qqcc-config-frontend"].ref' release-v2/control-plane-manifest.json)"
          backend_ref="$(jq -r '.artifacts["dashboard-backend"].ref' release-v2/control-plane-manifest.json)"
          web_ref="$(jq -r '.artifacts["web-api"].ref' release-v2/control-plane-manifest.json)"
          docker run --rm --entrypoint sh "$dashboard_ref" -c '/docker-entrypoint.d/05-select-dashboard-spa.sh && test -f /etc/nginx/templates/default.conf.template'
          docker run --rm --entrypoint sh -e DASHBOARD_FRONTEND_MODE=qqcc "$qqcc_ref" -c '/docker-entrypoint.d/05-select-dashboard-spa.sh && test -f /etc/nginx/templates/default.conf.template'
          docker run --rm --entrypoint python -e MINIO_ENDPOINT=127.0.0.1:1 "$backend_ref" -c 'import dashboard.backend.main; import dashboard.backend.qqcc_config_main'
          docker run --rm --entrypoint ffmpeg "$web_ref" -version

      - name: Inspect release images and Web bytes for environment neutrality
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p neutral-web-dist
          tar -xzf release-v2/public-web-dist.tgz -C neutral-web-dist
          python scripts/validate_release_environment_neutral.py \
            --release-index release-v2/release-index.json \
            --web-dist neutral-web-dist

      - name: Publish immutable v2 bundle
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUNDLE_REPOSITORY: ${{ steps.source.outputs.bundle_repository }}
        run: |
          set -euo pipefail
          if oras manifest fetch "${BUNDLE_REPOSITORY}:${SOURCE_SHA}" >/dev/null 2>&1; then
            echo "immutable bundle tag already exists" >&2
            exit 1
          fi
          oras push "${BUNDLE_REPOSITORY}:${SOURCE_SHA}" \
            --artifact-type application/vnd.allbot.release-index.v2 \
            release-v2/release-index.json:application/vnd.allbot.release-index.v2+json \
            release-v2/control-plane-manifest.json:application/vnd.allbot.release-manifest.v2+json \
            release-v2/test-execution-manifest.json:application/vnd.allbot.release-manifest.v2+json \
            release-v2/gpu-execution-manifest.json:application/vnd.allbot.release-manifest.v2+json \
            release-v2/public-web-dist.tgz:application/vnd.allbot.public-web.v1+gzip

      - uses: actions/upload-artifact@v4
        with:
          name: release-v2-${{ steps.source.outputs.sha }}
          path: release-v2
          if-no-files-found: error
          retention-days: 90
