name: Build RunPod LTX Video Profile Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR tag. Leave empty to use <UTC date>-ltx-video-<short sha>."
        required: false
        default: ""
      base_image:
        description: "Base image. Default matches the existing cu128 RunPod runtime."
        required: false
        default: "yanwk/comfyui-boot:cu128-slim"
      comfyui_ref:
        description: "ComfyUI git ref with the LTX 2.3 core nodes."
        required: false
        default: "f026b01ba576d98442839861a0eb0046bc2250d3"
      node_source_image:
        description: "Public image used to copy KJNodes, VideoHelperSuite, rgthree, and LTXVideo nodes."
        required: false
        default: "ghcr.io/giraffu/allbot-comfy-runpod-wan22-aio-video:20260619-wan22aio-rife-bcf3ebd"
      push_image:
        description: "Push the image to GHCR after build and smoke test."
        required: true
        type: boolean
        default: true
      verify_public_pull:
        description: "Verify anonymous GHCR manifest access after push."
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-ltx-video-profile-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: allbot-comfy-runpod-ltx-video
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and publish LTX video profile
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby
          docker system prune -af || true
          echo "Disk after cleanup:"
          df -h /

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ inputs.image_tag }}"
          if [[ -z "${tag}" ]]; then
            tag="$(date -u +%Y%m%d)-ltx-video-${GITHUB_SHA::7}"
          fi
          image_ref="ghcr.io/${owner}/${IMAGE_NAME}:${tag}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${image_ref}"

      - name: Login to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke test, and optionally push
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --profile ltx_video
            --image-ref "${{ steps.meta.outputs.image_ref }}"
            --base-image "${{ inputs.base_image }}"
            --comfyui-ref "${{ inputs.comfyui_ref }}"
            --node-source-image "${{ inputs.node_source_image }}"
          )
          if [[ "${{ inputs.push_image }}" == "true" ]]; then
            args+=(--push)
          fi
          scripts/build_runpod_profile_image.sh "${args[@]}"

      - name: Inspect local image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "${{ steps.meta.outputs.image_ref }}" \
            --format 'id={{.Id}} profile={{ index .Config.Labels "allbot.runpod.profile" }} model_sync={{ index .Config.Labels "allbot.runpod.model_sync" }}'

      - name: Verify anonymous GHCR manifest access
        if: ${{ inputs.push_image && inputs.verify_public_pull }}
        shell: bash
        run: |
          set -euo pipefail
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          if ! DOCKER_CONFIG="${tmp_docker_config}" docker manifest inspect "${{ steps.meta.outputs.image_ref }}" >/dev/null; then
            echo "::error::Anonymous GHCR manifest check failed for ${{ steps.meta.outputs.image_ref }}. Make the GHCR package public before using it in RunPod."
            exit 1
          fi
          echo "Anonymous GHCR manifest check passed."

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## RunPod LTX Video Profile Image"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image_ref }}\`"
            echo "- Base image: \`${{ inputs.base_image }}\`"
            echo "- ComfyUI ref: \`${{ inputs.comfyui_ref }}\`"
            echo "- Node source image: \`${{ inputs.node_source_image }}\`"
            echo "- Pushed: \`${{ inputs.push_image }}\`"
            echo "- Anonymous manifest verified: \`${{ inputs.verify_public_pull }}\`"
            echo ""
            echo "Next RunPod env candidate:"
            echo ""
            echo "\`\`\`env"
            echo "RUNPOD_IMAGE_NAME_LTX_VIDEO=${{ steps.meta.outputs.image_ref }}"
            echo "RUNPOD_USE_TEMPLATE_LTX_VIDEO=false"
            echo 'RUNPOD_GPU_TYPE_IDS_LTX_VIDEO="NVIDIA GeForce RTX 5090,NVIDIA GeForce RTX 4090"'
            echo "RUNPOD_CONTAINER_DISK_GB_LTX_VIDEO=180"
            echo "RUNPOD_COMFY_CUSTOM_NODES_ENABLED=false"
            echo "RUNPOD_COMFY_KJNODES_ENABLED=false"
            echo "RUNPOD_MODEL_PREFIX_LTX_VIDEO=ltx_video/2026-06-10"
            echo "RUNPOD_MODEL_MANIFEST_KEY_LTX_VIDEO=ltx_video/2026-06-10/manifest.json"
            echo 'RUNPOD_TASK_TYPE_WORKFLOW_OVERRIDES_LTX_VIDEO='\''{"ltx_video":"LTX 2.3 10Eros v1.2 I2V 6.1.json","ltx_video_flf2v":"LTX 2.3 10Eros v1.2 FLF2V 6.1.json","ltx_video_v2v_audio":"LTX 2.3 10Eros v1.2 V2V Audio 6.1.json"}'\'''
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
