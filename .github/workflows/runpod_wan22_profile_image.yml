name: Build RunPod Wan22 Profile Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR tag. Leave empty to use <UTC date>-wan22aio-<short sha>."
        required: false
        default: ""
      base_image:
        description: "Base image. Default matches the proven LAN ComfyUI cu128 runtime."
        required: false
        default: "yanwk/comfyui-boot:cu128-slim"
      comfyui_ref:
        description: "ComfyUI git ref used when the base image does not include ComfyUI."
        required: false
        default: "master"
      kjnodes_ref:
        description: "ComfyUI-KJNodes git ref baked into the image."
        required: false
        default: "7967a946c296a74901606e6a8d1195aa2b6f9215"
      reuse_base_custom_nodes:
        description: "Reuse custom nodes already baked into the base image and only apply final Wan22 fix layers."
        required: true
        type: boolean
        default: false
      push_image:
        description: "Push the image to GHCR after build and smoke test."
        required: true
        type: boolean
        default: true
      verify_public_pull:
        description: "Verify anonymous GHCR manifest access after push."
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-wan22-profile-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: allbot-comfy-runpod-wan22-aio-video
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and publish Wan22 profile
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ inputs.image_tag }}"
          if [[ -z "${tag}" ]]; then
            tag="$(date -u +%Y%m%d)-wan22aio-${GITHUB_SHA::7}"
          fi
          image_ref="ghcr.io/${owner}/${IMAGE_NAME}:${tag}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${image_ref}"

      - name: Login to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke test, and optionally push
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --profile wan22_aio_video
            --image-ref "${{ steps.meta.outputs.image_ref }}"
            --base-image "${{ inputs.base_image }}"
            --comfyui-ref "${{ inputs.comfyui_ref }}"
            --kjnodes-ref "${{ inputs.kjnodes_ref }}"
          )
          if [[ "${{ inputs.reuse_base_custom_nodes }}" == "true" ]]; then
            args+=(--reuse-base-custom-nodes)
          fi
          if [[ "${{ inputs.push_image }}" == "true" ]]; then
            args+=(--push)
          fi
          scripts/build_runpod_profile_image.sh "${args[@]}"

      - name: Inspect local image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "${{ steps.meta.outputs.image_ref }}" \
            --format 'id={{.Id}} profile={{ index .Config.Labels "allbot.runpod.profile" }} model_sync={{ index .Config.Labels "allbot.runpod.model_sync" }}'

      - name: Verify anonymous GHCR manifest access
        if: ${{ inputs.push_image && inputs.verify_public_pull }}
        shell: bash
        run: |
          set -euo pipefail
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          if ! DOCKER_CONFIG="${tmp_docker_config}" docker manifest inspect "${{ steps.meta.outputs.image_ref }}" >/dev/null; then
            echo "::error::Anonymous GHCR manifest check failed for ${{ steps.meta.outputs.image_ref }}. Make the GHCR package public before using it in RunPod."
            exit 1
          fi
          echo "Anonymous GHCR manifest check passed."

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## RunPod Wan22 Profile Image"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image_ref }}\`"
            echo "- Base image: \`${{ inputs.base_image }}\`"
            echo "- Reuse base custom nodes: \`${{ inputs.reuse_base_custom_nodes }}\`"
            echo "- ComfyUI ref: \`${{ inputs.comfyui_ref }}\`"
            echo "- KJNodes ref: \`${{ inputs.kjnodes_ref }}\`"
            echo "- Pushed: \`${{ inputs.push_image }}\`"
            echo "- Anonymous manifest verified: \`${{ inputs.verify_public_pull }}\`"
            echo ""
            echo "Next RunPod env candidate:"
            echo ""
            echo "\`\`\`env"
            echo "RUNPOD_IMAGE_NAME_WAN22_AIO_VIDEO=${{ steps.meta.outputs.image_ref }}"
            echo "RUNPOD_USE_TEMPLATE_WAN22_AIO_VIDEO=false"
            echo "RUNPOD_COMFY_CUSTOM_NODES_ENABLED=false"
            echo "RUNPOD_COMFY_KJNODES_ENABLED=false"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
