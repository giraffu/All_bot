name: Build RunPod LTX T2V Profile Image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full origin/main-reachable SHA to bake and publish.
        required: true
      base_image:
        description: Base image for the external-model RunPod runtime.
        required: false
        default: "yanwk/comfyui-boot:cu128-slim"
      comfyui_ref:
        description: Pinned ComfyUI revision with the required LTX core nodes.
        required: false
        default: "7bf8bfcd078c7f4ae50ca5149c9ff7d8613e1fb1"
      node_source_image:
        description: Public image supplying KJNodes, VideoHelperSuite, and rgthree.
        required: false
        default: "ghcr.io/giraffu/allbot-comfy-runpod-wan22-aio-video:20260619-wan22aio-rife-bcf3ebd"
      verify_public_pull:
        description: Verify anonymous GHCR manifest access after push.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-ltx-t2v-profile-image-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: allbot-gpu-ltx-t2v
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and publish LTX T2V profile
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify trusted source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --prune origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby
          docker system prune -af || true
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image
        id: image
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_ref="ghcr.io/${owner}/${IMAGE_NAME}:${SOURCE_SHA}"
          if docker manifest inspect "$image_ref" >/dev/null 2>&1; then
            echo "::error::Immutable LTX T2V image already exists: ${image_ref}"
            exit 2
          fi
          echo "ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Build, smoke test, and push
        shell: bash
        env:
          ALLBOT_GIT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          scripts/build_runpod_profile_image.sh \
            --profile ltx_t2v \
            --image-ref "${{ steps.image.outputs.ref }}" \
            --base-image "${{ inputs.base_image }}" \
            --comfyui-ref "${{ inputs.comfyui_ref }}" \
            --node-source-image "${{ inputs.node_source_image }}" \
            --push

      - name: Verify baked revisions and external-model contract
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$IMAGE_REF" --format '{{ index .Config.Labels "io.allbot.runpod.agent-revision" }}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$IMAGE_REF" --format '{{ index .Config.Labels "io.allbot.runpod.workflow-revision" }}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$IMAGE_REF" --format '{{ index .Config.Labels "allbot.runpod.model_sync" }}')" = "external-r2-manifest"

      - name: Verify anonymous GHCR manifest access
        if: ${{ inputs.verify_public_pull }}
        shell: bash
        run: |
          set -euo pipefail
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          DOCKER_CONFIG="${tmp_docker_config}" \
            docker manifest inspect "${{ steps.image.outputs.ref }}" >/dev/null

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## RunPod LTX T2V / IC-LoRA artifact"
            echo ""
            echo "- Source SHA: \`${{ inputs.source_sha }}\`"
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Profile: \`ltx_t2v\`"
            echo "- Task types: \`ltx_t2v,ltx_t2v_ic\`"
            echo "- Model manifest: \`ltx_t2v/2026-07-22/manifest.json\`"
            echo "- Models baked into image: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
