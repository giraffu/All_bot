name: Build RunPod i2i_pro Profile Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR tag. Leave empty to use <UTC date>-i2ipro-<short sha>."
        required: false
        default: ""
      base_image:
        description: "Base image. Default targets RunPod RTX 4090 hosts with CUDA 12.4 drivers."
        required: false
        default: "yanwk/comfyui-boot:cu124-slim"
      comfyui_ref:
        description: "ComfyUI git ref with Flux2 edit nodes used by i2i_pro."
        required: false
        default: "16cd8d8a8f5f16ce7e5f929fdba9f783990254ea"
      push_image:
        description: "Push the image to GHCR after build and smoke test."
        required: true
        type: boolean
        default: true
      verify_public_pull:
        description: "Verify anonymous GHCR manifest access after push."
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-i2i-pro-profile-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: allbot-comfy-runpod-i2i-pro
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and publish i2i_pro profile
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ inputs.image_tag }}"
          if [[ -z "${tag}" ]]; then
            tag="$(date -u +%Y%m%d)-i2ipro-${GITHUB_SHA::7}"
          fi
          image_ref="ghcr.io/${owner}/${IMAGE_NAME}:${tag}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${image_ref}"

      - name: Login to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke test, and optionally push
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --profile i2i_pro
            --image-ref "${{ steps.meta.outputs.image_ref }}"
            --base-image "${{ inputs.base_image }}"
            --comfyui-ref "${{ inputs.comfyui_ref }}"
          )
          if [[ "${{ inputs.push_image }}" == "true" ]]; then
            args+=(--push)
          fi
          scripts/build_runpod_profile_image.sh "${args[@]}"

      - name: Inspect local image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "${{ steps.meta.outputs.image_ref }}" \
            --format 'id={{.Id}} profile={{ index .Config.Labels "allbot.runpod.profile" }} model_sync={{ index .Config.Labels "allbot.runpod.model_sync" }}'

      - name: Verify anonymous GHCR manifest access
        if: ${{ inputs.push_image && inputs.verify_public_pull }}
        shell: bash
        run: |
          set -euo pipefail
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          if ! DOCKER_CONFIG="${tmp_docker_config}" docker manifest inspect "${{ steps.meta.outputs.image_ref }}" >/dev/null; then
            echo "::error::Anonymous GHCR manifest check failed for ${{ steps.meta.outputs.image_ref }}. Make the GHCR package public before using it in RunPod."
            exit 1
          fi
          echo "Anonymous GHCR manifest check passed."

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## RunPod i2i_pro Profile Image"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image_ref }}\`"
            echo "- Base image: \`${{ inputs.base_image }}\`"
            echo "- ComfyUI ref: \`${{ inputs.comfyui_ref }}\`"
            echo "- Pushed: \`${{ inputs.push_image }}\`"
            echo "- Anonymous manifest verified: \`${{ inputs.verify_public_pull }}\`"
            echo ""
            echo "Next RunPod env candidate:"
            echo ""
            echo "\`\`\`env"
            echo "RUNPOD_IMAGE_NAME_I2I_PRO=${{ steps.meta.outputs.image_ref }}"
            echo "RUNPOD_USE_TEMPLATE_I2I_PRO=false"
            echo "RUNPOD_COMFY_CUSTOM_NODES_ENABLED=false"
            echo "RUNPOD_COMFY_KJNODES_ENABLED=false"
            echo "RUNPOD_MODEL_PREFIX_I2I_PRO=i2i_pro/2026-06-14-test"
            echo "RUNPOD_MODEL_MANIFEST_KEY_I2I_PRO=i2i_pro/2026-06-14-test/manifest.json"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
