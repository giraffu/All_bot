services:
  allbot-model-cache-lan:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: allbot-model-cache-lan
    restart: unless-stopped
    command: server /data --address ":9010" --console-address ":9011"
    ports:
      - "127.0.0.1:9010:9010"
      - "192.168.1.115:9010:9010"
      - "127.0.0.1:9011:9011"
    environment:
      MINIO_ROOT_USER: ${LAN_MODEL_CACHE_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${LAN_MODEL_CACHE_SECRET_KEY:?}
    volumes:
      - /srv/allbot/model-cache-lan:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9010/minio/health/ready >/dev/null || exit 1
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
