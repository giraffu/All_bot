x-worker-environment: &worker-environment
  ALLBOT_RELEASE_SHA: ${ALLBOT_RELEASE_SHA:?ALLBOT_RELEASE_SHA is required}
  ALLBOT_CONFIG_REVISION: ${ALLBOT_CONFIG_REVISION:?ALLBOT_CONFIG_REVISION is required}
  AGENT_SECRET_TOKEN: ${AGENT_SECRET_TOKEN:?AGENT_SECRET_TOKEN is required}
  MASTER_API_URL: http://127.0.0.1:${ALLBOT_WORKER_RELAY_PORT:?ALLBOT_WORKER_RELAY_PORT is required}
  UPLOAD_SIDECAR_URL: http://127.0.0.1:${ALLBOT_WORKER_RELAY_PORT:?ALLBOT_WORKER_RELAY_PORT is required}
  RESULT_SPOOL_DIR: /app/spool
  PREFETCH_ENABLED: ${PREFETCH_ENABLED:-true}
  PREFETCH_DEPTH: ${PREFETCH_DEPTH:-1}
  PIPELINE_ENABLED: ${PIPELINE_ENABLED:-true}
  PIPELINE_MAX_RUNNING_TASKS: ${PIPELINE_MAX_RUNNING_TASKS:-2}
  TZ: Asia/Shanghai

x-worker-base: &worker-base
  image: ${ALLBOT_WORKER_AGENT_IMAGE:?release.env must pin ALLBOT_WORKER_AGENT_IMAGE by digest}
  restart: always
  network_mode: host
  env_file:
    - ${ALLBOT_ENV_FILE:?ALLBOT_ENV_FILE is required}
  volumes:
    - ${ALLBOT_WORKER_STATE_ROOT:?ALLBOT_WORKER_STATE_ROOT is required}/logs:/app/logs
    - ${ALLBOT_WORKER_STATE_ROOT:?ALLBOT_WORKER_STATE_ROOT is required}/spool:/app/spool
    - ${ALLBOT_WORKER_STATE_ROOT:?ALLBOT_WORKER_STATE_ROOT is required}/prefetch-cache:/app/prefetch-cache
  depends_on: [worker-relay]

x-worker-slot-environment: &worker-slot-environment
  <<: *worker-environment
  POOL_MANAGED: "true"
  POOL_PROVIDER: ${ALLBOT_WORKER_POOL_PROVIDER:-lan_ssh}
  COMFY_INPUT_DIR: /tmp/input
  COMFY_OUTPUT_DIR: /tmp/output

services:
  worker-relay:
    image: ${ALLBOT_WORKER_RELAY_IMAGE:?release.env must pin ALLBOT_WORKER_RELAY_IMAGE by digest}
    restart: always
    network_mode: host
    env_file:
      - ${ALLBOT_ENV_FILE:?ALLBOT_ENV_FILE is required}
    command: ["python", "/app/local_relay/relay_main.py"]
    environment:
      <<: *worker-environment
      CENTRAL_API_URL: ${ALLBOT_WORKER_CENTRAL_API_URL:?ALLBOT_WORKER_CENTRAL_API_URL is required}
      LOCAL_RELAY_HOST: 127.0.0.1
      LOCAL_RELAY_PORT: ${ALLBOT_WORKER_RELAY_PORT:?ALLBOT_WORKER_RELAY_PORT is required}
    volumes:
      - ${ALLBOT_WORKER_STATE_ROOT:?ALLBOT_WORKER_STATE_ROOT is required}/logs:/app/logs
      - ${ALLBOT_WORKER_STATE_ROOT:?ALLBOT_WORKER_STATE_ROOT is required}/spool:/app/spool

  worker-01:
    <<: *worker-base
    environment:
      <<: *worker-slot-environment
      AGENT_ID: ${ALLBOT_WORKER_01_AGENT_ID:-disabled_worker_01}
      COMFY_API_URL: ${ALLBOT_WORKER_01_COMFY_API_URL:-http://127.0.0.1:9}
      COMFY_WS_URL: ${ALLBOT_WORKER_01_COMFY_WS_URL:-ws://127.0.0.1:9/ws}
      SUPPORTED_TASK_TYPES: ${ALLBOT_WORKER_01_TASK_TYPES:-disabled}
      TASK_TYPE_WORKFLOW_OVERRIDES: ${ALLBOT_WORKER_01_TASK_TYPE_WORKFLOW_OVERRIDES:-}
      POOL_NODE_ID: ${ALLBOT_WORKER_01_NODE_ID:-disabled-node-01}
      POOL_GPU_INDEX: ${ALLBOT_WORKER_01_GPU_INDEX:-0}
      POOL_RUNTIME_PROFILE: ${ALLBOT_WORKER_01_RUNTIME_PROFILE:-disabled}
      PREFETCH_ENABLED: ${ALLBOT_WORKER_01_PREFETCH_ENABLED:-false}
      PIPELINE_ENABLED: ${ALLBOT_WORKER_01_PIPELINE_ENABLED:-false}
      PIPELINE_MAX_RUNNING_TASKS: ${ALLBOT_WORKER_01_PIPELINE_MAX_RUNNING_TASKS:-1}
  worker-02:
