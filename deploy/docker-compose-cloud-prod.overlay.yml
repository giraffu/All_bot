services:
  central-api:
    ports: ["${CLOUD_PROD_BIND_IP:-127.0.0.1}:8003:8003"]
  web-api:
    ports: ["${CLOUD_PROD_BIND_IP:-127.0.0.1}:8000:8001"]
  payment-api:
    ports: ["${CLOUD_PROD_BIND_IP:-127.0.0.1}:8002:8002"]
  dashboard-backend:
    ports: ["${CLOUD_PROD_BIND_IP:-127.0.0.1}:8043:8043"]
    environment:
      API_BASE: http://central-api:8003
      DASHBOARD_RUNPOD_AUTOSCALER_ENABLED: ${DASHBOARD_RUNPOD_AUTOSCALER_ENABLED:-true}
      DASHBOARD_RUNPOD_AUTOSCALER_MODE: ${DASHBOARD_RUNPOD_AUTOSCALER_MODE:-execute}
      DASHBOARD_RUNPOD_ENV_FILE: ${DASHBOARD_RUNPOD_ENV_FILE:-/dev/null}
      DASHBOARD_RUNPOD_PROD_ENV_FILE: ${DASHBOARD_RUNPOD_PROD_ENV_FILE:-/dev/null}
      RUNPOD_RELEASE_PROFILE_PINS_JSON: ${RUNPOD_RELEASE_PROFILE_PINS_JSON:?RUNPOD_RELEASE_PROFILE_PINS_JSON is required}
      RUNPOD_IMAGE_NAME_PORNMASTER_FLUX2_EDIT: ${RUNPOD_IMAGE_NAME_PORNMASTER_FLUX2_EDIT:?RUNPOD_IMAGE_NAME_PORNMASTER_FLUX2_EDIT is required}
      DASHBOARD_LAN_AIO_EXECUTION_MODE: ssh
      DASHBOARD_LAN_AIO_RUNNER_HOST: ${DASHBOARD_LAN_AIO_RUNNER_HOST:?DASHBOARD_LAN_AIO_RUNNER_HOST is required}
      DASHBOARD_LAN_AIO_RUNNER_PROJECT_ROOT: ${DASHBOARD_LAN_AIO_RUNNER_PROJECT_ROOT:-/home/hfy/APP/All_bot}
      DASHBOARD_LAN_AIO_RUNNER_SSH_COMMAND: ssh -p ${DASHBOARD_LAN_AIO_RUNNER_SSH_PORT:-2222} -i /app/runtime/lan-aio-runner/id_ed25519
    volumes:
      - ${DASHBOARD_LAN_AIO_RUNNER_KEY_DIR:?DASHBOARD_LAN_AIO_RUNNER_KEY_DIR is required}/id_ed25519:/app/runtime/lan-aio-runner/id_ed25519:ro
  dashboard-frontend:
    ports: ["${CLOUD_PROD_BIND_IP:-127.0.0.1}:8086:8086"]
  qqcc-config-backend:
    ports: ["${CLOUD_PROD_BIND_IP:-127.0.0.1}:8045:8045"]
  qqcc-config-frontend:
    ports: ["${CLOUD_PROD_BIND_IP:-127.0.0.1}:8088:8088"]
  imgproxy:
    ports: ["${CLOUD_PROD_BIND_IP:-127.0.0.1}:8084:8084"]
