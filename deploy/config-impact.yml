{
  "schema_version": 1,
  "unknown_services": "all",
  "rules": [
    {"patterns": ["REQUIRED_CHANNEL_ID", "CHANNEL_*", "REFUGE_*", "MAIN_BOT_LAZY_BOT_*"], "services": ["bot"]},
    {"patterns": ["SUPPORT_BOT_*"], "services": ["dashboard-backend", "support-bot"]},
    {"patterns": ["BOT_*", "QQCC_*", "PRIVATE_QQCC_BOT_*", "TELEGRAM_*"], "services": ["bot", "qqcc-bot", "qqcc-private-bot-worker", "qqcc-config-backend", "qqcc-config-frontend"]},
    {"patterns": ["DATABASE_*", "CLOUD_*_DATABASE_*", "REDIS_*", "CLOUD_*_REDIS_*", "JWT_*"], "services": ["central-api", "web-api", "task-control-worker", "payment-api", "dashboard-backend", "qqcc-config-backend", "bot", "qqcc-bot", "qqcc-private-bot-worker", "paid-group-guard-bot"]},
    {"patterns": ["MINIO_*", "R2_*"], "services": ["central-api", "web-api", "dashboard-backend", "bot", "qqcc-bot", "qqcc-private-bot-worker", "worker"]},
    {"patterns": ["MEDIA_ARCHIVE_*"], "services": ["web-api"]},
    {"patterns": ["DASHBOARD_*"], "services": ["dashboard-backend", "dashboard-frontend"]},
    {"patterns": ["LTX_T2V_BACKEND_ENABLED", "LTX_T2V_MSR_ENABLED"], "services": ["web-api"]},
    {"patterns": ["MINIMAX_H3_PROMPT_OPTIMIZER_ENABLED"], "services": ["web-api", "bot"]},
    {"patterns": ["ALLBOT_WORKER_*", "AGENT_SECRET_TOKEN", "PREFETCH_*", "PIPELINE_*"], "services": ["worker"]},
    {"patterns": ["PAID_GROUP_*"], "services": ["paid-group-guard-bot"]},
    {"patterns": ["GROUP_MANAGE_*"], "services": ["dashboard-backend", "group-manage-bot"]},
    {"patterns": ["CLOUDFLARE_*"], "services": ["web-static"]}
  ]
}
