{
  "schema_version": 1,
  "common": {
    "required": [
      "ALLBOT_ENV",
      "ALLBOT_STATE_ROOT",
      "DATABASE_URL",
      "REDIS_URL",
      "WORKER_REDIS_URL",
      "AGENT_SECRET_TOKEN",
      "API_TOKEN",
      "MINIO_ENDPOINT",
      "MINIO_ACCESS_KEY",
      "MINIO_SECRET_KEY",
      "MINIO_SECURE"
    ],
    "forbidden_values": [
      "changeme",
      "change-me",
      "replace-me",
      "example",
      "your-secret-here"
    ]
  },
  "worker": {
    "selection_key": "ALLBOT_WORKER_SERVICES",
    "required_when_selected": [
      "ALLBOT_WORKER_STATE_ROOT",
      "ALLBOT_WORKER_CENTRAL_API_URL",
      "ALLBOT_WORKER_RELAY_PORT"
    ],
    "per_slot_required_templates": [
      "ALLBOT_WORKER_{slot}_AGENT_ID",
      "ALLBOT_WORKER_{slot}_COMFY_API_URL",
      "ALLBOT_WORKER_{slot}_COMFY_WS_URL",
      "ALLBOT_WORKER_{slot}_TASK_TYPES",
      "ALLBOT_WORKER_{slot}_NODE_ID",
      "ALLBOT_WORKER_{slot}_GPU_INDEX",
      "ALLBOT_WORKER_{slot}_RUNTIME_PROFILE",
      "ALLBOT_WORKER_{slot}_PREFETCH_ENABLED",
      "ALLBOT_WORKER_{slot}_PIPELINE_ENABLED",
      "ALLBOT_WORKER_{slot}_PIPELINE_MAX_RUNNING_TASKS"
    ],
    "per_slot_boolean_templates": [
      "ALLBOT_WORKER_{slot}_PREFETCH_ENABLED",
      "ALLBOT_WORKER_{slot}_PIPELINE_ENABLED"
    ],
    "per_slot_integer_templates": [
      "ALLBOT_WORKER_{slot}_GPU_INDEX",
      "ALLBOT_WORKER_{slot}_PIPELINE_MAX_RUNNING_TASKS"
    ]
  },
  "types": {
    "boolean": [
      "MINIO_SECURE",
      "MAIN_BOT_LAZY_BOT_ENABLED",
      "PRIVATE_QQCC_BOT_ENABLED",
      "TON_PAYMENT_POLLING_ENABLED",
      "USDT_TON_PAYMENT_ENABLED",
      "PREFETCH_ENABLED",
      "PIPELINE_ENABLED",
      "LTX_T2V_BACKEND_ENABLED"
    ],
    "integer": [
      "ALLBOT_WORKER_RELAY_PORT",
      "PREFETCH_DEPTH",
      "PIPELINE_MAX_RUNNING_TASKS",
      "PRIVATE_QQCC_BOT_WORKER_CONCURRENCY",
      "PRIVATE_QQCC_BOT_WORKER_BATCH_SIZE",
      "DASHBOARD_LAN_AIO_RUNNER_SSH_PORT"
    ]
  },
  "environments": {
    "test": {
      "required": [
        "BOT_TOKEN",
        "CLOUD_TEST_BIND_IP",
        "CLOUD_TEST_CONTROL_HOST",
        "CLOUD_TEST_DATABASE_URL",
        "CLOUD_TEST_REDIS_URL",
        "CLOUD_TEST_WORKER_REDIS_URL"
      ],
      "expected": {"ALLBOT_ENV": "test"}
    },
    "prod": {
      "required": [
        "BOT_TOKEN",
        "CLOUD_PROD_BIND_IP",
        "CLOUD_PROD_DATABASE_URL",
        "CLOUD_PROD_REDIS_URL",
        "CLOUD_PROD_WORKER_REDIS_URL",
        "JWT_SECRET_KEY",
        "QQCC_CONFIG_ADMIN_HOST",
        "PRIVATE_QQCC_BOT_OWNER_HOST",
        "DASHBOARD_LAN_AIO_RUNNER_HOST",
        "DASHBOARD_LAN_AIO_RUNNER_KEY_DIR"
      ],
      "expected": {"ALLBOT_ENV": "prod"},
      "forbidden_values_by_key": {
        "MINIO_SECURE": ["false", "0", "no"]
      }
    }
  },
  "forbidden_equal_pairs": []
}
