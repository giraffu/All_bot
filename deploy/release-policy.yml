{
  "schema_version": 1,
  "all_services": [
    "central-api",
    "web-api",
    "payment-api",
    "dashboard-backend",
    "dashboard-frontend",
    "qqcc-config-backend",
    "qqcc-config-frontend",
    "bot",
    "qqcc-bot",
    "qqcc-private-bot-worker",
    "paid-group-guard-bot",
    "imgproxy",
    "worker",
    "web-static"
  ],
  "level_order": ["none", "rolling", "drain", "maintenance"],
  "unknown": {
    "level": "maintenance",
    "services": "all"
  },
  "rules": [
    {
      "name": "shared-python-runtime",
      "patterns": [
        "src/**",
        "shared/**",
        "config.py",
        "requirements.txt",
        "Dockerfile",
        "Dockerfile.qqcc"
      ],
      "level": "rolling",
      "services": [
        "central-api",
        "web-api",
        "payment-api",
        "dashboard-backend",
        "qqcc-config-backend",
        "bot",
        "qqcc-bot",
        "qqcc-private-bot-worker",
        "paid-group-guard-bot",
        "worker"
      ]
    },
    {
      "name": "central-api",
      "patterns": ["backend/**"],
      "level": "rolling",
      "services": ["central-api"]
    },
    {
      "name": "dashboard-backend-image",
      "patterns": ["deploy/docker/Dockerfile.dashboard-backend"],
      "level": "rolling",
      "services": ["dashboard-backend"]
    },
    {
      "name": "dashboard-admin-backend",
      "patterns": [
        "dashboard/backend/main.py",
        "dashboard/backend/auth.py",
        "dashboard/backend/routers/runpod.py",
        "dashboard/backend/routers/system.py",
        "dashboard/backend/services/runpod_admin_*.py",
        "dashboard/backend/services/runpod_autoscaler_service.py",
        "dashboard/backend/services/runpod_operation_store.py",
        "dashboard/backend/services/system_service.py"
      ],
      "level": "rolling",
      "services": ["dashboard-backend"]
    },
    {
      "name": "dashboard-backends",
      "patterns": [
        "dashboard/backend/presenters/**",
        "dashboard/backend/routers/gallery.py",
        "dashboard/backend/routers/history.py",
        "dashboard/backend/routers/logs.py",
        "dashboard/backend/routers/paid_group_guard.py",
        "dashboard/backend/routers/plans.py",
        "dashboard/backend/routers/referrals.py",
        "dashboard/backend/routers/site_notice.py",
        "dashboard/backend/routers/stats.py",
        "dashboard/backend/routers/templates.py",
        "dashboard/backend/routers/users.py",
        "dashboard/backend/routers/utils.py",
        "dashboard/backend/routers/workers.py",
        "dashboard/backend/services/balance_monitor.py",
        "dashboard/backend/services/gallery_admin_service.py",
        "dashboard/backend/services/history_service.py",
        "dashboard/backend/services/log_admin_service.py",
        "dashboard/backend/services/paid_group_guard_admin_service.py",
        "dashboard/backend/services/plan_admin_service.py",
        "dashboard/backend/services/referral_admin_service.py",
        "dashboard/backend/services/site_notice_admin_service.py",
        "dashboard/backend/services/stats_service*.py",
        "dashboard/backend/services/template_admin_service.py",
        "dashboard/backend/services/user_admin_service.py",
        "dashboard/backend/services/worker_admin_service.py",
        "dashboard/backend/services/worker_listener.py"
      ],
      "level": "rolling",
      "services": ["dashboard-backend"]
    },
    {
      "name": "qqcc-config-backend",
      "patterns": [
        "dashboard/backend/qqcc_config_main.py",
        "dashboard/backend/qqcc_config_auth.py",
        "dashboard/backend/private_bot_owner_auth.py",
        "dashboard/backend/routers/qqcc.py",
        "dashboard/backend/routers/private_bots.py"
      ],
      "level": "rolling",
      "services": ["qqcc-config-backend"]
    },
    {
      "name": "dashboard-frontends",
      "patterns": ["dashboard/frontend/**"],
      "level": "rolling",
      "services": ["dashboard-frontend", "qqcc-config-frontend"]
    },
    {
      "name": "public-web",
      "patterns": ["frontend/**"],
      "level": "rolling",
      "services": ["web-static"]
    },
    {
      "name": "qqcc-runtimes",
      "patterns": ["qqcc_bot/**", "qqcc_private_bot/**"],
      "level": "rolling",
      "services": [
        "qqcc-bot",
        "qqcc-private-bot-worker",
        "qqcc-config-backend",
        "qqcc-config-frontend"
      ]
    },
    {
      "name": "local-workers",
      "patterns": ["workers/**"],
      "level": "drain",
      "services": ["worker"]
    },
    {
      "name": "database-migrations",
      "patterns": ["migrations/**", "alembic.ini"],
      "level": "maintenance",
      "services": "all",
      "requires_db_upgrade": true
    },
    {
      "name": "deployment-contract",
      "patterns": [
        "deploy/config-impact.yml",
        "deploy/docker-compose*.yml",
        "deploy/docker/Dockerfile.app",
        "deploy/docker/Dockerfile.central",
        "deploy/docker/Dockerfile.dashboard-frontend",
        "deploy/docker/Dockerfile.worker",
        "deploy/docker/nginx.dashboard.conf.template",
        "deploy/docker/python-release-entrypoint.sh",
        "deploy/docker/select-dashboard-spa.sh",
        "deploy/env.defaults",
        "deploy/env.schema.yml",
        "deploy/systemd/**",
        "deploy/test-acceptance.example.json",
        "scripts/release.py",
        "scripts/bootstrap_release_host.sh",
        "scripts/validate_deploy_env.py",
        ".dockerignore"
      ],
      "level": "maintenance",
      "services": "all"
    },
    {
      "name": "gpu-runtime",
      "patterns": [
        "remote_workers/**",
        "ops/gpu_pool_controller/**",
        "scripts/runpod_*.sh",
        "scripts/lan_aio_*.py",
        "scripts/lan_*_aio_*.sh"
      ],
      "level": "maintenance",
      "services": [],
      "blockers": ["gpu-runtime-release-required"]
    },
    {
      "name": "non-runtime",
      "patterns": [
        "docs/**",
        "tests/**",
        "deploy/release-policy.yml",
        ".codex/**",
        ".github/**",
        "README.md",
        "AGENTS.md",
        ".gitignore",
        ".markdownlint.yaml"
      ],
      "level": "none",
      "services": []
    }
  ]
}
