services:
  postgres:
    image: ${ALLBOT_POSTGRES_IMAGE:?release.env must pin postgres by digest}
    restart: always
    env_file: ["${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/postgres.env"]
    environment:
      POSTGRES_DB: ${CLOUD_TEST_POSTGRES_DB:-bot_db_test}
      POSTGRES_USER: ${CLOUD_TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CLOUD_TEST_POSTGRES_PASSWORD:?CLOUD_TEST_POSTGRES_PASSWORD is required}
    volumes:
      - cloud-postgres-test-data:/var/lib/postgresql/data
    networks:
      default:
        aliases: [postgres-test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${ALLBOT_REDIS_IMAGE:?release.env must pin redis by digest}
    restart: always
    env_file: ["${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/redis.env"]
    command: ["sh", "-lc", "redis-server --appendonly yes --save 60 1 --requirepass \"$${CLOUD_TEST_REDIS_PASSWORD}\""]
    volumes:
      - cloud-redis-test-data:/data
    networks:
      default:
        aliases: [redis-test]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${CLOUD_TEST_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  central-api:
    ports: ["${CLOUD_TEST_BIND_IP:-127.0.0.1}:8004:8003"]
    depends_on:
      redis: {condition: service_healthy}
  web-api:
    ports: ["${CLOUD_TEST_BIND_IP:-127.0.0.1}:8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      central-api: {condition: service_healthy}
  task-control-worker:
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      central-api: {condition: service_healthy}
  billing-reconciler:
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  payment-api:
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  dashboard-backend:
    ports: ["${CLOUD_TEST_BIND_IP:-127.0.0.1}:8043:8043"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  dashboard-frontend:
    ports: ["${CLOUD_TEST_BIND_IP:-127.0.0.1}:8086:8086"]
    depends_on:
      dashboard-backend: {condition: service_healthy}
  qqcc-config-backend:
    ports: ["${CLOUD_TEST_BIND_IP:-127.0.0.1}:8045:8045"]
  qqcc-config-frontend:
    ports: ["${CLOUD_TEST_BIND_IP:-127.0.0.1}:8088:8088"]
  imgproxy:
    ports: ["${CLOUD_TEST_BIND_IP:-127.0.0.1}:8084:8084"]

volumes:
  cloud-postgres-test-data:
    external: true
    name: deploy_cloud-postgres-test-data
  cloud-redis-test-data:
    external: true
    name: deploy_cloud-redis-test-data
