version: '3.8'

services:
  central-api-prod:
    build:
      context: ../backend
    container_name: cloud-central-api-prod
    restart: always
    env_file:
      - ../.env.cloud.prod
    environment:
      TZ: Asia/Shanghai
      REDIS_URL: ${CLOUD_PROD_WORKER_REDIS_URL:?CLOUD_PROD_WORKER_REDIS_URL is required}
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required}
      AGENT_SECRET_TOKEN: ${AGENT_SECRET_TOKEN:?AGENT_SECRET_TOKEN is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-data-prod}
      MINIO_INPUT_BUCKET: ${MINIO_INPUT_BUCKET:-user-data-prod}
      MINIO_RESULT_BUCKET: ${MINIO_RESULT_BUCKET:-user-data-prod}
      MINIO_TEMPLATE_BUCKET: ${MINIO_TEMPLATE_BUCKET:-user-data-prod}
      MINIO_SECURE: ${MINIO_SECURE:-true}
    volumes:
      - ../backend/app:/app/app:ro
      - ../src:/app/src:ro
      - ../logs/cloud-prod:/app/logs
    ports:
      - "${CLOUD_PROD_BIND_IP:-127.0.0.1}:8003:8003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-api-prod:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: cloud-web-api-prod
    restart: always
    env_file:
      - ../.env.cloud.prod
    environment:
      BOT_TYPE: PROD
      REDIS_PREFIX: prod_bot_
      TZ: Asia/Shanghai
      API_BASE: http://central-api-prod:8003
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      PRIVATE_QQCC_BOT_ENABLED: ${PRIVATE_QQCC_BOT_ENABLED:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      DATABASE_URL: ${CLOUD_PROD_DATABASE_URL:?CLOUD_PROD_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_PROD_REDIS_URL:?CLOUD_PROD_REDIS_URL is required}
      WORKER_REDIS_URL: ${CLOUD_PROD_WORKER_REDIS_URL:?CLOUD_PROD_WORKER_REDIS_URL is required}
      GENERATION_MAINTENANCE_FILE: /app/runtime-flags/GENERATION_MAINTENANCE
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-data-prod}
      MINIO_INPUT_BUCKET: ${MINIO_INPUT_BUCKET:-user-data-prod}
      MINIO_RESULT_BUCKET: ${MINIO_RESULT_BUCKET:-user-data-prod}
      MINIO_TEMPLATE_BUCKET: ${MINIO_TEMPLATE_BUCKET:-user-data-prod}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      LEGACY_MINIO_READ_FALLBACK_ENABLED: "false"
      LEGACY_MINIO_ENDPOINT: ""
      LEGACY_MINIO_ACCESS_KEY: ""
      LEGACY_MINIO_SECRET_KEY: ""
      LEGACY_MINIO_BUCKET: ${LEGACY_MINIO_BUCKET:-bot-data}
      LEGACY_MINIO_RESULT_BUCKET: ${LEGACY_MINIO_RESULT_BUCKET:-comfyui-temp}
      LEGACY_MINIO_PUBLIC_URL: ""
      LEGACY_MINIO_SECURE: ${LEGACY_MINIO_SECURE:-false}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?R2_ACCESS_KEY is required}
      R2_SECRET_KEY: ${R2_SECRET_KEY:?R2_SECRET_KEY is required}
      R2_BUCKET: ${R2_BUCKET:-user-data-prod}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:?R2_PUBLIC_DOMAIN is required}
      IMGPROXY_URL: http://imgproxy-prod:8084
      DB_POOL_SIZE: 6
      DB_MAX_OVERFLOW: 6
    volumes:
      - ../logs/cloud-prod:/app/logs
      - ../runtime/cloud-prod:/app/runtime-flags
    ports:
      - "${CLOUD_PROD_BIND_IP:-127.0.0.1}:8000:8000"
    depends_on:
      central-api-prod:
        condition: service_healthy
      imgproxy-prod:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "src.web_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  payment-api-prod:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: cloud-payment-api-prod
    restart: always
    env_file:
      - ../.env.cloud.prod
    environment:
      BOT_TYPE: PROD
      REDIS_PREFIX: prod_bot_
      TZ: Asia/Shanghai
      DATABASE_URL: ${CLOUD_PROD_DATABASE_URL:?CLOUD_PROD_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_PROD_REDIS_URL:?CLOUD_PROD_REDIS_URL is required}
      PAYMENT_API_PORT: ${PAYMENT_API_PORT:-8021}
      DB_POOL_SIZE: 4
      DB_MAX_OVERFLOW: 3
    volumes:
      - ../logs/cloud-prod:/app/logs
    ports:
      - "${CLOUD_PROD_BIND_IP:-127.0.0.1}:8021:8021"
    command: ["python", "src/payment_api_server.py"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8021/pay/result', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  dashboard-backend-prod:
    build:
      context: ../
      dockerfile: dashboard/backend/Dockerfile
    container_name: cloud-dashboard-backend-prod
    restart: always
    env_file:
      - ../.env.cloud.prod
    environment:
      BOT_TYPE: PROD
      REDIS_PREFIX: prod_bot_
      TZ: Asia/Shanghai
      DATABASE_URL: ${CLOUD_PROD_DATABASE_URL:?CLOUD_PROD_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_PROD_REDIS_URL:?CLOUD_PROD_REDIS_URL is required}
      WORKER_REDIS_URL: ${CLOUD_PROD_WORKER_REDIS_URL:?CLOUD_PROD_WORKER_REDIS_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-data-prod}
      MINIO_TEMPLATE_BUCKET: ${MINIO_TEMPLATE_BUCKET:-user-data-prod}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      LEGACY_MINIO_READ_FALLBACK_ENABLED: "false"
      LEGACY_MINIO_ENDPOINT: ""
      LEGACY_MINIO_ACCESS_KEY: ""
      LEGACY_MINIO_SECRET_KEY: ""
      LEGACY_MINIO_BUCKET: ${LEGACY_MINIO_BUCKET:-bot-data}
      LEGACY_MINIO_RESULT_BUCKET: ${LEGACY_MINIO_RESULT_BUCKET:-comfyui-temp}
      LEGACY_MINIO_PUBLIC_URL: ""
      LEGACY_MINIO_SECURE: ${LEGACY_MINIO_SECURE:-false}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?R2_ACCESS_KEY is required}
      R2_SECRET_KEY: ${R2_SECRET_KEY:?R2_SECRET_KEY is required}
      R2_BUCKET: ${R2_BUCKET:-user-data-prod}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:?R2_PUBLIC_DOMAIN is required}
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME:?DASHBOARD_ADMIN_USERNAME is required}
      DASHBOARD_ADMIN_PASSWORD_HASH: ${DASHBOARD_ADMIN_PASSWORD_HASH:?DASHBOARD_ADMIN_PASSWORD_HASH is required}
      DASHBOARD_SECRET_KEY: ${DASHBOARD_SECRET_KEY:?DASHBOARD_SECRET_KEY is required}
      DB_POOL_SIZE: 6
      DB_MAX_OVERFLOW: 4
      DASHBOARD_RUNPOD_AUTOSCALER_ENABLED: ${DASHBOARD_RUNPOD_AUTOSCALER_ENABLED:-true}
      DASHBOARD_RUNPOD_AUTOSCALER_MODE: ${DASHBOARD_RUNPOD_AUTOSCALER_MODE:-execute}
      DASHBOARD_RUNPOD_AUTOSCALER_INTERVAL_SECONDS: ${DASHBOARD_RUNPOD_AUTOSCALER_INTERVAL_SECONDS:-60}
      DASHBOARD_RUNPOD_AUTOSCALER_SCALE_UP_WAIT_SECONDS: ${DASHBOARD_RUNPOD_AUTOSCALER_SCALE_UP_WAIT_SECONDS:-1800}
      DASHBOARD_RUNPOD_AUTOSCALER_SCALE_DOWN_WAIT_SECONDS: ${DASHBOARD_RUNPOD_AUTOSCALER_SCALE_DOWN_WAIT_SECONDS:-60}
      DASHBOARD_RUNPOD_AUTOSCALER_COOLDOWN_SECONDS: ${DASHBOARD_RUNPOD_AUTOSCALER_COOLDOWN_SECONDS:-600}
      DASHBOARD_RUNPOD_AUTOSCALER_MAX_RUNPODS_PER_PROFILE: ${DASHBOARD_RUNPOD_AUTOSCALER_MAX_RUNPODS_PER_PROFILE:-5}
      DASHBOARD_RUNPOD_AUTOSCALER_HEARTBEAT_MAX_AGE_SECONDS: ${DASHBOARD_RUNPOD_AUTOSCALER_HEARTBEAT_MAX_AGE_SECONDS:-300}
      RUNPOD_IMAGE_NAME_PORNMASTER_FLUX2_EDIT: ${RUNPOD_IMAGE_NAME_PORNMASTER_FLUX2_EDIT:-ghcr.io/giraffu/allbot-comfy-runpod-pornmaster-flux2-edit:20260701-pornmaster-flux2-edit-14d2d88-local1}
      RUNPOD_USE_TEMPLATE_PORNMASTER_FLUX2_EDIT: ${RUNPOD_USE_TEMPLATE_PORNMASTER_FLUX2_EDIT:-false}
      RUNPOD_MODEL_PREFIX_PORNMASTER_FLUX2_EDIT: ${RUNPOD_MODEL_PREFIX_PORNMASTER_FLUX2_EDIT:-pornmaster_flux2_edit/2026-06-27}
      RUNPOD_MODEL_MANIFEST_KEY_PORNMASTER_FLUX2_EDIT: ${RUNPOD_MODEL_MANIFEST_KEY_PORNMASTER_FLUX2_EDIT:-pornmaster_flux2_edit/2026-06-27/manifest.json}
      RUNPOD_CONTAINER_DISK_GB_PORNMASTER_FLUX2_EDIT: ${RUNPOD_CONTAINER_DISK_GB_PORNMASTER_FLUX2_EDIT:-120}
      RUNPOD_GPU_TYPE_IDS_PORNMASTER_FLUX2_EDIT: ${RUNPOD_GPU_TYPE_IDS_PORNMASTER_FLUX2_EDIT:-NVIDIA GeForce RTX 4090,NVIDIA L40S,NVIDIA GeForce RTX 5090}
      DASHBOARD_LAN_AIO_EXECUTION_MODE: ${DASHBOARD_LAN_AIO_EXECUTION_MODE:-local}
      DASHBOARD_LAN_AIO_RUNNER_HOST: ${DASHBOARD_LAN_AIO_RUNNER_HOST:-}
      DASHBOARD_LAN_AIO_RUNNER_PROJECT_ROOT: ${DASHBOARD_LAN_AIO_RUNNER_PROJECT_ROOT:-/home/hfy/APP/All_bot}
      DASHBOARD_LAN_AIO_RUNNER_SSH_COMMAND: ${DASHBOARD_LAN_AIO_RUNNER_SSH_COMMAND:-ssh -i /app/runtime/lan-aio-runner/id_ed25519}
      PAID_GROUP_MODERATION_CONFIG_FILE: /app/runtime/paid-group-guard/config.json
      PAID_GROUP_MODERATION_LOG_FILE: /app/logs/paid_group_moderation.jsonl
    volumes:
      - ../.env.cloud.prod:/app/.env:ro
      - ../logs/cloud-prod:/app/logs
      - ../runtime/cloud-prod/paid-group-guard:/app/runtime/paid-group-guard
      - ../runtime/cloud-prod/lan-aio-runner:/app/runtime/lan-aio-runner:ro
    ports:
      - "${CLOUD_PROD_BIND_IP:-127.0.0.1}:8043:8043"
    command:
      [
        "gunicorn",
        "dashboard.backend.main:app",
        "-w",
        "1",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "--bind",
        "0.0.0.0:8043",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8043/api/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  dashboard-frontend-prod:
    build:
      context: ../dashboard/frontend
      dockerfile: Dockerfile.cloud
    container_name: cloud-dashboard-frontend-prod
    restart: always
    environment:
      DASHBOARD_GATEWAY_PORT: ${DASHBOARD_FRONTEND_PORT:-8086}
      DASHBOARD_BACKEND_HOST: dashboard-backend-prod:8043
      TZ: Asia/Shanghai
    ports:
      - "${CLOUD_PROD_BIND_IP:-127.0.0.1}:${DASHBOARD_FRONTEND_PORT:-8086}:${DASHBOARD_FRONTEND_PORT:-8086}"
    depends_on:
      dashboard-backend-prod:
        condition: service_healthy
    volumes:
      - cloud-dashboard-frontend-prod-cache:/var/cache/nginx
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:$${DASHBOARD_GATEWAY_PORT}/ && wget -q -O /dev/null http://127.0.0.1:$${DASHBOARD_GATEWAY_PORT}/api/health",
        ]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 20s

  qqcc-config-backend-prod:
    build:
      context: ../
      dockerfile: dashboard/backend/Dockerfile
    container_name: cloud-qqcc-config-backend-prod
    restart: always
    env_file:
      - ../.env.cloud.prod
    environment:
      BOT_TYPE: PROD
      REDIS_PREFIX: prod_bot_
      TZ: Asia/Shanghai
      DATABASE_URL: ${CLOUD_PROD_DATABASE_URL:?CLOUD_PROD_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_PROD_REDIS_URL:?CLOUD_PROD_REDIS_URL is required}
      QQCC_CONFIG_ADMIN_USERNAME: ${QQCC_CONFIG_ADMIN_USERNAME:?QQCC_CONFIG_ADMIN_USERNAME is required}
      QQCC_CONFIG_ADMIN_PASSWORD_HASH: ${QQCC_CONFIG_ADMIN_PASSWORD_HASH:?QQCC_CONFIG_ADMIN_PASSWORD_HASH is required}
      QQCC_CONFIG_SECRET_KEY: ${QQCC_CONFIG_SECRET_KEY:?QQCC_CONFIG_SECRET_KEY is required}
      PRIVATE_QQCC_BOT_ENABLED: ${PRIVATE_QQCC_BOT_ENABLED:-false}
      PRIVATE_QQCC_BOT_TOKEN_KEYRING: ${PRIVATE_QQCC_BOT_TOKEN_KEYRING:-}
      PRIVATE_QQCC_BOT_TOKEN_ACTIVE_KEY_VERSION: ${PRIVATE_QQCC_BOT_TOKEN_ACTIVE_KEY_VERSION:-}
      PRIVATE_QQCC_BOT_TOKEN_FINGERPRINT_KEY: ${PRIVATE_QQCC_BOT_TOKEN_FINGERPRINT_KEY:-}
      PRIVATE_QQCC_BOT_FORBIDDEN_BOT_IDS: ${PRIVATE_QQCC_BOT_FORBIDDEN_BOT_IDS:-}
      PRIVATE_QQCC_BOT_TELEGRAM_API_BASE_URL: ${PRIVATE_QQCC_BOT_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      PRIVATE_QQCC_BOT_TELEGRAM_FILE_BASE_URL: ${PRIVATE_QQCC_BOT_TELEGRAM_FILE_BASE_URL:-https://api.telegram.org/file/bot}
      PRIVATE_QQCC_BOT_TELEGRAM_TRUSTED_HOSTS: ${PRIVATE_QQCC_BOT_TELEGRAM_TRUSTED_HOSTS:-}
      PRIVATE_QQCC_BOT_OWNER_JWT_SECRET: ${PRIVATE_QQCC_BOT_OWNER_JWT_SECRET:-}
      PRIVATE_QQCC_BOT_WEBHOOK_BASE_URL: ${PRIVATE_QQCC_BOT_WEBHOOK_BASE_URL:-}
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 2
    volumes:
      - ../.env.cloud.prod:/app/.env:ro
      - ../logs/cloud-prod:/app/logs
    ports:
      - "${CLOUD_PROD_BIND_IP:-127.0.0.1}:8045:8045"
    command:
      [
        "gunicorn",
        "dashboard.backend.qqcc_config_main:app",
        "-w",
        "1",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "--bind",
        "0.0.0.0:8045",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8045/api/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  qqcc-config-frontend-prod:
    build:
      context: ../dashboard/frontend
      dockerfile: Dockerfile.qqcc-config.cloud
    container_name: cloud-qqcc-config-frontend-prod
    restart: always
    environment:
      DASHBOARD_GATEWAY_PORT: ${QQCC_CONFIG_FRONTEND_PORT:-8088}
      DASHBOARD_BACKEND_HOST: qqcc-config-backend-prod:8045
      PRIVATE_QQCC_BOT_OWNER_HOST: ${PRIVATE_QQCC_BOT_OWNER_HOST:-private-bot-disabled.invalid}
      QQCC_CONFIG_ADMIN_HOST: ${QQCC_CONFIG_ADMIN_HOST:?QQCC_CONFIG_ADMIN_HOST is required}
      TZ: Asia/Shanghai
    ports:
      - "${CLOUD_PROD_BIND_IP:-127.0.0.1}:${QQCC_CONFIG_FRONTEND_PORT:-8088}:${QQCC_CONFIG_FRONTEND_PORT:-8088}"
    depends_on:
      qqcc-config-backend-prod:
        condition: service_healthy
    volumes:
      - cloud-qqcc-config-frontend-prod-cache:/var/cache/nginx
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --header=\"Host: $${QQCC_CONFIG_ADMIN_HOST}\" -O /dev/null http://127.0.0.1:$${DASHBOARD_GATEWAY_PORT}/ && wget -q --header=\"Host: $${QQCC_CONFIG_ADMIN_HOST}\" -O /dev/null http://127.0.0.1:$${DASHBOARD_GATEWAY_PORT}/api/health",
        ]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 20s

  imgproxy-prod:
    image: darthsim/imgproxy:latest
    container_name: cloud-imgproxy-prod
    restart: always
    environment:
      IMGPROXY_BIND: :8084
      IMGPROXY_ENFORCE_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 1
      IMGPROXY_DOWNLOAD_TIMEOUT: 5
      IMGPROXY_CONCURRENCY: 4
    ports:
      - "${CLOUD_PROD_BIND_IP:-127.0.0.1}:8084:8084"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "[ \"$$(ps -o comm= 1)\" = \"imgproxy\" ]",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  bot-prod:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: cloud-tg-bot-prod
    profiles: ["bot"]
    restart: always
    env_file:
      - ../.env.cloud.prod
    environment:
      BOT_TYPE: PROD
      REDIS_PREFIX: prod_bot_
      ENABLE_PUBLIC_SHARE: "false"
      QQCC_LAZY_BOT_ENABLED: ${QQCC_LAZY_BOT_ENABLED:-true}
      API_BASE: http://central-api-prod:8003
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      DATABASE_URL: ${CLOUD_PROD_DATABASE_URL:?CLOUD_PROD_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_PROD_REDIS_URL:?CLOUD_PROD_REDIS_URL is required}
      WORKER_REDIS_URL: ${CLOUD_PROD_WORKER_REDIS_URL:?CLOUD_PROD_WORKER_REDIS_URL is required}
      GENERATION_MAINTENANCE_FILE: /app/runtime-flags/GENERATION_MAINTENANCE
      DB_POOL_SIZE: 4
      DB_MAX_OVERFLOW: 4
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-data-prod}
      MINIO_INPUT_BUCKET: ${MINIO_INPUT_BUCKET:-user-data-prod}
      MINIO_RESULT_BUCKET: ${MINIO_RESULT_BUCKET:-user-data-prod}
      MINIO_TEMPLATE_BUCKET: ${MINIO_TEMPLATE_BUCKET:-user-data-prod}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?R2_ACCESS_KEY is required}
      R2_SECRET_KEY: ${R2_SECRET_KEY:?R2_SECRET_KEY is required}
      R2_BUCKET: ${R2_BUCKET:-user-data-prod}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:?R2_PUBLIC_DOMAIN is required}
      TON_PAYMENT_POLLING_ENABLED: ${TON_PAYMENT_POLLING_ENABLED:-true}
      TZ: Asia/Shanghai
    volumes:
      - ../logs/cloud-prod:/app/logs
      - ../runtime/cloud-prod:/app/runtime-flags
    depends_on:
      central-api-prod:
        condition: service_healthy

  qqcc-bot-prod:
    build:
      context: ../
      dockerfile: Dockerfile.qqcc
    container_name: cloud-qqcc-bot-prod
    profiles: ["qqcc-bot"]
    restart: always
    env_file:
      - ../.env.cloud.prod
    environment:
      BOT_TYPE: PROD
      REDIS_PREFIX: prod_bot_
      ENABLE_PUBLIC_SHARE: "false"
      API_BASE: http://central-api-prod:8003
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      QQCC_BOT_TOKEN: ${QQCC_BOT_TOKEN:-}
      PRIVATE_QQCC_BOT_ENABLED: ${PRIVATE_QQCC_BOT_ENABLED:-false}
      PRIVATE_QQCC_BOT_TOKEN_KEYRING: ${PRIVATE_QQCC_BOT_TOKEN_KEYRING:-}
      PRIVATE_QQCC_BOT_TOKEN_ACTIVE_KEY_VERSION: ${PRIVATE_QQCC_BOT_TOKEN_ACTIVE_KEY_VERSION:-}
      PRIVATE_QQCC_BOT_TOKEN_FINGERPRINT_KEY: ${PRIVATE_QQCC_BOT_TOKEN_FINGERPRINT_KEY:-}
      PRIVATE_QQCC_BOT_FORBIDDEN_BOT_IDS: ${PRIVATE_QQCC_BOT_FORBIDDEN_BOT_IDS:-}
      PRIVATE_QQCC_BOT_TELEGRAM_API_BASE_URL: ${PRIVATE_QQCC_BOT_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      PRIVATE_QQCC_BOT_TELEGRAM_FILE_BASE_URL: ${PRIVATE_QQCC_BOT_TELEGRAM_FILE_BASE_URL:-https://api.telegram.org/file/bot}
