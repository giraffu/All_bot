version: '3.8'

services:
  bot-test:
    build: 
      context: ../
      dockerfile: Dockerfile
    container_name: tg-bot-test
    restart: always
    env_file:
      - ../.env.test
    environment:
      - BOT_TYPE=TEST
      - REDIS_PREFIX=test_bot_
      - ENABLE_PUBLIC_SHARE=false
      - API_BASE=http://host.docker.internal:8004
      - TZ=Asia/Shanghai
    volumes:
      - ../logs:/app/logs
      - ../src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "host" # Use host network to easily access 192.168.1.115 services

  payment-api-test:
    build: 
      context: ../
      dockerfile: Dockerfile
    container_name: payment-api-test
    restart: always
    env_file:
      - ../.env.test
    environment:
      - BOT_TYPE=TEST
      - REDIS_PREFIX=test_bot_
      - PAYMENT_API_PORT=8022
      - TZ=Asia/Shanghai
    volumes:
      - ../logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "host"
    command: ["python", "src/payment_api_server.py"]

  web-api-test:
    build: 
      context: ../
      dockerfile: Dockerfile
    container_name: web-api-test
    restart: always
    env_file:
      - ../.env.test
    environment:
      - BOT_TYPE=TEST
      - REDIS_PREFIX=test_bot_
      - TZ=Asia/Shanghai
    volumes:
      - ../logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "host"
    command: ["uvicorn", "src.web_api.main:app", "--host", "0.0.0.0", "--port", "8001"]

  web-frontend-test:
    image: node:22-alpine
    container_name: web-frontend-test
    restart: always
    working_dir: /app/frontend
    environment:
      - TZ=Asia/Shanghai
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../frontend:/app/frontend
      - ../shared:/app/shared:ro
      - frontend-test-node-modules:/app/frontend/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "host"
    command:
      [
        "sh",
        "-c",
        "npm config set registry https://registry.npmmirror.com && npm install --no-fund --no-audit && npm run dev:test -- --host 0.0.0.0 --port 5173 --strictPort",
      ]

volumes:
  frontend-test-node-modules:
