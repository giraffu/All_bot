services:
  postgres-test:
    image: postgres:15
    container_name: cloud-postgres-test
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      POSTGRES_DB: ${CLOUD_TEST_POSTGRES_DB:-bot_db_test}
      POSTGRES_USER: ${CLOUD_TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CLOUD_TEST_POSTGRES_PASSWORD:?CLOUD_TEST_POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - cloud-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis-test:
    image: redis:7-alpine
    container_name: cloud-redis-test
    restart: always
    env_file:
      - ../.env.cloud.test
    command:
      [
        "sh",
        "-lc",
        "redis-server --appendonly yes --save 60 1 --requirepass \"$${CLOUD_TEST_REDIS_PASSWORD}\"",
      ]
    volumes:
      - cloud-redis-test-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${CLOUD_TEST_REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  central-api-test:
    build:
      context: ../backend
    container_name: cloud-central-api-test
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      TZ: Asia/Shanghai
      REDIS_URL: ${CLOUD_TEST_WORKER_REDIS_URL:?CLOUD_TEST_WORKER_REDIS_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_INPUT_BUCKET: ${MINIO_INPUT_BUCKET:-bot-data-test}
      MINIO_RESULT_BUCKET: ${MINIO_RESULT_BUCKET:-comfyui-temp-test}
    volumes:
      - ../backend/app:/app/app
      - ../src:/app/src
    ports:
      - "${CLOUD_TEST_BIND_IP:-127.0.0.1}:8004:8003"
    depends_on:
      redis-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-api-test:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: cloud-web-api-test
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      BOT_TYPE: TEST
      REDIS_PREFIX: cloud_test_bot_
      TZ: Asia/Shanghai
      API_BASE: http://central-api-test:8003
      API_BASE_TEST: http://central-api-test:8003
      DATABASE_URL: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      DATABASE_URL_TEST: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      REDIS_URL_TEST: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      WORKER_REDIS_URL: ${CLOUD_TEST_WORKER_REDIS_URL:?CLOUD_TEST_WORKER_REDIS_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      IMGPROXY_URL: http://imgproxy-test:8084
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
    volumes:
      - ../logs/cloud-test:/app/logs
    ports:
      - "${CLOUD_TEST_BIND_IP:-127.0.0.1}:8001:8001"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      central-api-test:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "src.web_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "2",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  dashboard-backend-test:
    build:
      context: ../
      dockerfile: dashboard/backend/Dockerfile
    container_name: cloud-dashboard-backend-test
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      BOT_TYPE: TEST
      REDIS_PREFIX: cloud_test_bot_
      TZ: Asia/Shanghai
      DATABASE_URL: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      DATABASE_URL_TEST: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      REDIS_URL_TEST: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      WORKER_REDIS_URL: ${CLOUD_TEST_WORKER_REDIS_URL:?CLOUD_TEST_WORKER_REDIS_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME:-admin}
      DASHBOARD_ADMIN_PASSWORD_HASH: ${DASHBOARD_ADMIN_PASSWORD_HASH:?DASHBOARD_ADMIN_PASSWORD_HASH is required}
      DASHBOARD_SECRET_KEY: ${DASHBOARD_SECRET_KEY:?DASHBOARD_SECRET_KEY is required}
      DB_POOL_SIZE: 1
      DB_MAX_OVERFLOW: 2
    volumes:
      - ../.env.cloud.test:/app/.env:ro
      - ../logs/cloud-test:/app/logs
    ports:
      - "${CLOUD_TEST_BIND_IP:-127.0.0.1}:8044:8044"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command:
      [
        "gunicorn",
        "dashboard.backend.main:app",
        "-w",
        "2",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "--bind",
        "0.0.0.0:8044",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8044/api/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  dashboard-frontend-test:
    build:
      context: ../dashboard/frontend
      dockerfile: Dockerfile.cloud
    container_name: cloud-dashboard-frontend-test
    restart: always
    environment:
      DASHBOARD_GATEWAY_PORT: ${DASHBOARD_FRONTEND_TEST_PORT:-8087}
      DASHBOARD_BACKEND_HOST: dashboard-backend-test:8044
      TZ: Asia/Shanghai
    ports:
      - "${CLOUD_TEST_BIND_IP:-127.0.0.1}:${DASHBOARD_FRONTEND_TEST_PORT:-8087}:${DASHBOARD_FRONTEND_TEST_PORT:-8087}"
    depends_on:
      dashboard-backend-test:
        condition: service_healthy
    volumes:
      - cloud-dashboard-frontend-test-cache:/var/cache/nginx
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:$${DASHBOARD_GATEWAY_PORT}/ && wget -q -O /dev/null http://127.0.0.1:$${DASHBOARD_GATEWAY_PORT}/api/health",
        ]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 20s

  imgproxy-test:
    image: darthsim/imgproxy:latest
    container_name: cloud-imgproxy-test
    restart: always
    environment:
      IMGPROXY_BIND: :8084
      IMGPROXY_ENFORCE_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 1
      IMGPROXY_DOWNLOAD_TIMEOUT: 5
      IMGPROXY_CONCURRENCY: 4
    ports:
      - "${CLOUD_TEST_BIND_IP:-127.0.0.1}:8084:8084"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "[ \"$$(ps -o comm= 1)\" = \"imgproxy\" ]",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  bot-test:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: cloud-tg-bot-test
    profiles: ["bot"]
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      BOT_TYPE: TEST
      REDIS_PREFIX: cloud_test_bot_
      ENABLE_PUBLIC_SHARE: "false"
      API_BASE: http://central-api-test:8003
      API_BASE_TEST: http://central-api-test:8003
      DATABASE_URL: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      DATABASE_URL_TEST: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      REDIS_URL_TEST: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      TON_PAYMENT_POLLING_ENABLED: ${CLOUD_TEST_TON_PAYMENT_POLLING_ENABLED:-false}
      TZ: Asia/Shanghai
    volumes:
      - ../logs/cloud-test:/app/logs
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      central-api-test:
        condition: service_healthy

volumes:
  cloud-postgres-test-data:
  cloud-redis-test-data:
  cloud-dashboard-frontend-test-cache:
