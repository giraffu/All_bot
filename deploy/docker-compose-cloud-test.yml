services:
  postgres-test:
    image: postgres:15
    container_name: cloud-postgres-test
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      POSTGRES_DB: ${CLOUD_TEST_POSTGRES_DB:-bot_db_test}
      POSTGRES_USER: ${CLOUD_TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CLOUD_TEST_POSTGRES_PASSWORD:?CLOUD_TEST_POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - cloud-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis-test:
    image: redis:7-alpine
    container_name: cloud-redis-test
    restart: always
    env_file:
      - ../.env.cloud.test
    command:
      [
        "sh",
        "-lc",
        "redis-server --appendonly yes --save 60 1 --requirepass \"$${CLOUD_TEST_REDIS_PASSWORD}\"",
      ]
    volumes:
      - cloud-redis-test-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${CLOUD_TEST_REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  central-api-test:
    build:
      context: ../backend
    container_name: cloud-central-api-test
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      TZ: Asia/Shanghai
      REDIS_URL: ${CLOUD_TEST_WORKER_REDIS_URL:?CLOUD_TEST_WORKER_REDIS_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_INPUT_BUCKET: ${MINIO_INPUT_BUCKET:-bot-data-test}
      MINIO_RESULT_BUCKET: ${MINIO_RESULT_BUCKET:-comfyui-temp-test}
      LEGACY_RESULT_COMPLETION_ENABLED: ${LEGACY_RESULT_COMPLETION_ENABLED:-true}
    volumes:
      - ../backend/app:/app/app
      - ../src:/app/src
    ports:
      - "${CLOUD_TEST_BIND_IP:-127.0.0.1}:8004:8003"
    depends_on:
      redis-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-api-test:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: cloud-web-api-test
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      BOT_TYPE: TEST
      REDIS_PREFIX: cloud_test_bot_
      TZ: Asia/Shanghai
      API_BASE: http://central-api-test:8003
      API_BASE_TEST: http://central-api-test:8003
      PRIVATE_QQCC_BOT_ENABLED: ${PRIVATE_QQCC_BOT_ENABLED:-false}
      DATABASE_URL: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      DATABASE_URL_TEST: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      REDIS_URL_TEST: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      WORKER_REDIS_URL: ${CLOUD_TEST_WORKER_REDIS_URL:?CLOUD_TEST_WORKER_REDIS_URL is required}
      GENERATION_MAINTENANCE_FILE: /app/runtime-flags/GENERATION_MAINTENANCE
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      IMGPROXY_URL: http://imgproxy-test:8084
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
    volumes:
      - ../logs/cloud-test:/app/logs
      - ../runtime/cloud-test:/app/runtime-flags
    ports:
      - "${CLOUD_TEST_BIND_IP:-127.0.0.1}:8001:8001"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      central-api-test:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "src.web_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "2",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  imgproxy-test:
    image: darthsim/imgproxy:latest
    container_name: cloud-imgproxy-test
    restart: always
    environment:
      IMGPROXY_BIND: :8084
      IMGPROXY_ENFORCE_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 1
      IMGPROXY_DOWNLOAD_TIMEOUT: 5
      IMGPROXY_CONCURRENCY: 4
    ports:
      - "${CLOUD_TEST_BIND_IP:-127.0.0.1}:8084:8084"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "[ \"$$(ps -o comm= 1)\" = \"imgproxy\" ]",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  bot-test:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: cloud-tg-bot-test
    profiles: ["bot"]
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      BOT_TYPE: TEST
      REDIS_PREFIX: cloud_test_bot_
      ENABLE_PUBLIC_SHARE: "false"
      QQCC_LAZY_BOT_ENABLED: ${QQCC_LAZY_BOT_ENABLED:-true}
      API_BASE: http://central-api-test:8003
      API_BASE_TEST: http://central-api-test:8003
      DATABASE_URL: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      DATABASE_URL_TEST: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      REDIS_URL_TEST: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      GENERATION_MAINTENANCE_FILE: /app/runtime-flags/GENERATION_MAINTENANCE
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      TON_PAYMENT_POLLING_ENABLED: ${CLOUD_TEST_TON_PAYMENT_POLLING_ENABLED:-false}
      TZ: Asia/Shanghai
    volumes:
      - ../logs/cloud-test:/app/logs
      - ../runtime/cloud-test:/app/runtime-flags
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      central-api-test:
        condition: service_healthy

  qqcc-bot-test:
    build:
      context: ../
      dockerfile: Dockerfile.qqcc
    container_name: cloud-qqcc-bot-test
    profiles: ["qqcc-bot"]
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      BOT_TYPE: TEST
      REDIS_PREFIX: cloud_test_bot_
      ENABLE_PUBLIC_SHARE: "false"
      API_BASE: http://central-api-test:8003
      API_BASE_TEST: http://central-api-test:8003
      QQCC_BOT_TOKEN_TEST: ${QQCC_BOT_TOKEN_TEST:-}
      PRIVATE_QQCC_BOT_ENABLED: ${PRIVATE_QQCC_BOT_ENABLED:-false}
      PRIVATE_QQCC_BOT_TOKEN_KEYRING: ${PRIVATE_QQCC_BOT_TOKEN_KEYRING:-}
      PRIVATE_QQCC_BOT_TOKEN_ACTIVE_KEY_VERSION: ${PRIVATE_QQCC_BOT_TOKEN_ACTIVE_KEY_VERSION:-}
      PRIVATE_QQCC_BOT_TOKEN_FINGERPRINT_KEY: ${PRIVATE_QQCC_BOT_TOKEN_FINGERPRINT_KEY:-}
      PRIVATE_QQCC_BOT_FORBIDDEN_BOT_IDS: ${PRIVATE_QQCC_BOT_FORBIDDEN_BOT_IDS:-}
      PRIVATE_QQCC_BOT_TELEGRAM_API_BASE_URL: ${PRIVATE_QQCC_BOT_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      PRIVATE_QQCC_BOT_TELEGRAM_FILE_BASE_URL: ${PRIVATE_QQCC_BOT_TELEGRAM_FILE_BASE_URL:-https://api.telegram.org/file/bot}
      PRIVATE_QQCC_BOT_TELEGRAM_TRUSTED_HOSTS: ${PRIVATE_QQCC_BOT_TELEGRAM_TRUSTED_HOSTS:-}
      PRIVATE_QQCC_BOT_WEBHOOK_BASE_URL: ${PRIVATE_QQCC_BOT_WEBHOOK_BASE_URL:-}
      PRIVATE_QQCC_BOT_OWNER_WEBAPP_URL: ${PRIVATE_QQCC_BOT_OWNER_WEBAPP_URL:-}
      PRIVATE_QQCC_BOT_OWNER_HOST: ${PRIVATE_QQCC_BOT_OWNER_HOST:-}
      DATABASE_URL: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      DATABASE_URL_TEST: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      REDIS_URL_TEST: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      WORKER_REDIS_URL: ${CLOUD_TEST_WORKER_REDIS_URL:?CLOUD_TEST_WORKER_REDIS_URL is required}
      GENERATION_MAINTENANCE_FILE: /app/runtime-flags/GENERATION_MAINTENANCE
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      TON_PAYMENT_POLLING_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - ../logs/cloud-test:/app/logs
      - ../runtime/cloud-test:/app/runtime-flags
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      central-api-test:
        condition: service_healthy
    command:
      [
        "sh",
        "-lc",
        "test -n \"$${QQCC_BOT_TOKEN_TEST}\" || { echo 'QQCC_BOT_TOKEN_TEST is required'; exit 1; }; exec python -m qqcc_bot.main",
      ]

  qqcc-private-bot-worker-test:
    build:
      context: ../
      dockerfile: Dockerfile.qqcc
    container_name: cloud-qqcc-private-bot-worker-test
    profiles: ["qqcc-private-bots"]
    restart: always
    env_file:
      - ../.env.cloud.test
    environment:
      BOT_TYPE: TEST
      REDIS_PREFIX: cloud_test_bot_
      ENABLE_PUBLIC_SHARE: "false"
      API_BASE: http://central-api-test:8003
      API_BASE_TEST: http://central-api-test:8003
      QQCC_BOT_TOKEN_TEST: ${QQCC_BOT_TOKEN_TEST:-}
      DATABASE_URL: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      DATABASE_URL_TEST: ${CLOUD_TEST_DATABASE_URL:?CLOUD_TEST_DATABASE_URL is required}
      REDIS_URL: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      REDIS_URL_TEST: ${CLOUD_TEST_REDIS_URL:?CLOUD_TEST_REDIS_URL is required}
      WORKER_REDIS_URL: ${CLOUD_TEST_WORKER_REDIS_URL:?CLOUD_TEST_WORKER_REDIS_URL is required}
      GENERATION_MAINTENANCE_FILE: /app/runtime-flags/GENERATION_MAINTENANCE
      PRIVATE_QQCC_BOT_TOKEN_KEYRING: ${PRIVATE_QQCC_BOT_TOKEN_KEYRING:-}
      PRIVATE_QQCC_BOT_TOKEN_ACTIVE_KEY_VERSION: ${PRIVATE_QQCC_BOT_TOKEN_ACTIVE_KEY_VERSION:-}
      PRIVATE_QQCC_BOT_TELEGRAM_API_BASE_URL: ${PRIVATE_QQCC_BOT_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      PRIVATE_QQCC_BOT_TELEGRAM_FILE_BASE_URL: ${PRIVATE_QQCC_BOT_TELEGRAM_FILE_BASE_URL:-https://api.telegram.org/file/bot}
      PRIVATE_QQCC_BOT_TELEGRAM_TRUSTED_HOSTS: ${PRIVATE_QQCC_BOT_TELEGRAM_TRUSTED_HOSTS:-}
      PRIVATE_QQCC_BOT_WORKER_CONSUMER_GROUP: ${PRIVATE_QQCC_BOT_WORKER_CONSUMER_GROUP:-private-qqcc-bot-workers-test}
      PRIVATE_QQCC_BOT_WORKER_CONCURRENCY: ${PRIVATE_QQCC_BOT_WORKER_CONCURRENCY:-16}
      PRIVATE_QQCC_BOT_WORKER_BATCH_SIZE: ${PRIVATE_QQCC_BOT_WORKER_BATCH_SIZE:-50}
      PRIVATE_QQCC_BOT_WORKER_BLOCK_MS: ${PRIVATE_QQCC_BOT_WORKER_BLOCK_MS:-1000}
      PRIVATE_QQCC_BOT_WORKER_PENDING_IDLE_MS: ${PRIVATE_QQCC_BOT_WORKER_PENDING_IDLE_MS:-60000}
      PRIVATE_QQCC_BOT_WORKER_RETRY_SECONDS: ${PRIVATE_QQCC_BOT_WORKER_RETRY_SECONDS:-1}
      PRIVATE_QQCC_BOT_WORKER_PENDING_SWEEP_SECONDS: ${PRIVATE_QQCC_BOT_WORKER_PENDING_SWEEP_SECONDS:-30}
      PRIVATE_QQCC_BOT_APPLICATION_IDLE_SECONDS: ${PRIVATE_QQCC_BOT_APPLICATION_IDLE_SECONDS:-300}
      PRIVATE_QQCC_BOT_ADMISSION_TIMEOUT_SECONDS: ${PRIVATE_QQCC_BOT_ADMISSION_TIMEOUT_SECONDS:-300}
      PRIVATE_QQCC_BOT_ZOMBIE_SWEEP_SECONDS: ${PRIVATE_QQCC_BOT_ZOMBIE_SWEEP_SECONDS:-600}
      PRIVATE_QQCC_BOT_METRICS_PUBLISH_SECONDS: ${PRIVATE_QQCC_BOT_METRICS_PUBLISH_SECONDS:-15}
      PRIVATE_QQCC_BOT_WORKER_MAX_INFLIGHT_UPDATES: ${PRIVATE_QQCC_BOT_WORKER_MAX_INFLIGHT_UPDATES:-64}
      PRIVATE_QQCC_BOT_WORKER_PER_BOT_PREFETCH: ${PRIVATE_QQCC_BOT_WORKER_PER_BOT_PREFETCH:-8}
      PRIVATE_QQCC_BOT_WORKER_MAX_DEFERRED_UPDATES: ${PRIVATE_QQCC_BOT_WORKER_MAX_DEFERRED_UPDATES:-1024}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      TON_PAYMENT_POLLING_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - ../logs/cloud-test:/app/logs
      - ../runtime/cloud-test:/app/runtime-flags
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      central-api-test:
        condition: service_healthy
    command: ["python", "-m", "qqcc_private_bot.worker"]

volumes:
  cloud-postgres-test-data:
  cloud-redis-test-data:
