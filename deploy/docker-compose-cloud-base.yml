x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-environment: &app-environment
  ALLBOT_RELEASE_SHA: ${ALLBOT_RELEASE_SHA:?ALLBOT_RELEASE_SHA is required}
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Shanghai

x-app-base: &app-base
  restart: always
  logging: *json-logging
  environment: *app-environment

x-python-health: &python-health
  interval: 15s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  central-api:
    image: ${ALLBOT_CENTRAL_IMAGE:?release.env must pin ALLBOT_CENTRAL_IMAGE by digest}
    restart: always
    logging: *json-logging
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/central-api.env
        required: false
        format: raw
    environment:
      ALLBOT_RELEASE_SHA: ${ALLBOT_RELEASE_SHA:?ALLBOT_RELEASE_SHA is required}
      TZ: Asia/Shanghai
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003"]
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)"]

  web-api:
    <<: *app-base
    image: ${ALLBOT_WEB_API_IMAGE:?release.env must pin ALLBOT_WEB_API_IMAGE by digest}
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/web-api.env
        required: false
        format: raw
    command: ["uvicorn", "src.web_api.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/runtime:/app/runtime-flags
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5)"]

  task-control-worker:
    <<: *app-base
    image: ${ALLBOT_TASK_CONTROL_WORKER_IMAGE:?release.env must pin ALLBOT_TASK_CONTROL_WORKER_IMAGE by digest}
    profiles: ["task-control"]
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/task-control-worker.env
        required: false
        format: raw
    environment:
      <<: *app-environment
      TASK_CONTROL_WORKER_ENABLED: ${TASK_CONTROL_WORKER_ENABLED:-false}
    command: ["python", "-m", "src.task_control_worker"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/healthz', timeout=5)"]

  billing-reconciler:
    <<: *app-base
    image: ${ALLBOT_BILLING_RECONCILER_IMAGE:?release.env must pin ALLBOT_BILLING_RECONCILER_IMAGE by digest}
    profiles: ["billing-reconciler"]
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/billing-reconciler.env
        required: false
        format: raw
    environment:
      <<: *app-environment
      BILLING_RECONCILER_ENABLED: ${BILLING_RECONCILER_ENABLED:-false}
    command: ["python", "-m", "src.billing_reconciler"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8032/healthz', timeout=5)"]

  payment-api:
    <<: *app-base
    image: ${ALLBOT_PAYMENT_API_IMAGE:?release.env must pin ALLBOT_PAYMENT_API_IMAGE by digest}
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/payment-api.env
        required: false
        format: raw
    command: ["python", "src/payment_api_server.py"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.getenv('PAYMENT_API_PORT', '8021'); urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=5)"]

  dashboard-backend:
    profiles: [owner-tools]
    image: ${ALLBOT_DASHBOARD_BACKEND_IMAGE:?release.env must pin dashboard backend by digest}
    restart: always
    logging: *json-logging
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/dashboard-backend.env
        required: false
        format: raw
    environment:
      ALLBOT_RELEASE_SHA: ${ALLBOT_RELEASE_SHA:?ALLBOT_RELEASE_SHA is required}
      TZ: Asia/Shanghai
    command: ["gunicorn", "dashboard.backend.main:app", "-w", "2", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8043"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/runtime/paid-group-guard:/app/runtime/paid-group-guard
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/runtime/group-manage:/app/runtime/group-manage
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8043/api/health', timeout=5)"]

  support-bot:
    image: ${ALLBOT_SUPPORT_BOT_IMAGE:?release.env must pin ALLBOT_SUPPORT_BOT_IMAGE by digest}
    restart: always
    logging: *json-logging
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/support-bot.env
        required: false
        format: raw
    environment:
      ALLBOT_RELEASE_SHA: ${ALLBOT_RELEASE_SHA:?ALLBOT_RELEASE_SHA is required}
      TZ: Asia/Shanghai
    command: ["python", "-m", "support_bot.main"]

  dashboard-frontend:
    profiles: [owner-tools]
    image: ${ALLBOT_DASHBOARD_FRONTEND_IMAGE:?release.env must pin dashboard frontend by digest}
    restart: always
    logging: *json-logging
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/dashboard-frontend.env
        required: false
        format: raw
    environment:
      ALLBOT_RELEASE_SHA: ${ALLBOT_RELEASE_SHA:?ALLBOT_RELEASE_SHA is required}
      DASHBOARD_GATEWAY_PORT: "8086"
      DASHBOARD_BACKEND_HOST: dashboard-backend:8043
      DASHBOARD_FRONTEND_MODE: dashboard
    healthcheck:
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 20s
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8086/ && wget -q -O /dev/null http://127.0.0.1:8086/api/health"]

  qqcc-config-backend:
    profiles: [owner-tools]
    image: ${ALLBOT_QQCC_CONFIG_BACKEND_IMAGE:?release.env must pin QQCC config backend by digest}
    restart: always
    logging: *json-logging
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/qqcc-config-backend.env
        required: false
        format: raw
    environment:
      ALLBOT_RELEASE_SHA: ${ALLBOT_RELEASE_SHA:?ALLBOT_RELEASE_SHA is required}
      TZ: Asia/Shanghai
    command: ["gunicorn", "dashboard.backend.qqcc_config_main:app", "-w", "1", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8045"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8045/api/health', timeout=5)"]

  qqcc-config-frontend:
    profiles: [owner-tools]
    image: ${ALLBOT_QQCC_CONFIG_FRONTEND_IMAGE:?release.env must pin QQCC config frontend by digest}
    restart: always
    logging: *json-logging
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/qqcc-config-frontend.env
        required: false
        format: raw
    environment:
      ALLBOT_RELEASE_SHA: ${ALLBOT_RELEASE_SHA:?ALLBOT_RELEASE_SHA is required}
      DASHBOARD_GATEWAY_PORT: "8088"
      DASHBOARD_BACKEND_HOST: qqcc-config-backend:8045
      DASHBOARD_FRONTEND_MODE: qqcc
      PRIVATE_QQCC_BOT_OWNER_HOST: ${PRIVATE_QQCC_BOT_OWNER_HOST:-private-bot-disabled.invalid}
      QQCC_CONFIG_ADMIN_HOST: ${QQCC_CONFIG_ADMIN_HOST:?QQCC_CONFIG_ADMIN_HOST is required}
    healthcheck:
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 20s
      test: ["CMD-SHELL", "wget -q --header='Host: '$${QQCC_CONFIG_ADMIN_HOST} -O /dev/null http://127.0.0.1:8088/api/health"]

  imgproxy:
    image: ${ALLBOT_IMGPROXY_IMAGE:?release.env must pin imgproxy by digest}
    restart: always
    logging: *json-logging
    environment:
      IMGPROXY_BIND: :8084
      IMGPROXY_ENFORCE_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_ANIMATION_FRAMES: "1"
      IMGPROXY_DOWNLOAD_TIMEOUT: "5"
      IMGPROXY_CONCURRENCY: "4"
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
      test: ["CMD", "sh", "-c", "[ \"$$(ps -o comm= 1)\" = \"imgproxy\" ]"]

  bot:
    <<: *app-base
    image: ${ALLBOT_MAIN_BOT_IMAGE:?release.env must pin ALLBOT_MAIN_BOT_IMAGE by digest}
    profiles: ["bot"]
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/main-bot.env
        required: false
        format: raw
    command: ["python", "src/bot_main.py"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/runtime:/app/runtime-flags

  qqcc-bot:
    <<: *app-base
    image: ${ALLBOT_QQCC_BOT_IMAGE:?release.env must pin ALLBOT_QQCC_BOT_IMAGE by digest}
    profiles: ["qqcc-bot"]
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/qqcc-bot.env
        required: false
        format: raw
    command: ["python", "-m", "qqcc_bot.main"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/runtime:/app/runtime-flags

  qqcc-private-bot-worker:
    <<: *app-base
    image: ${ALLBOT_PRIVATE_BOT_WORKER_IMAGE:?release.env must pin ALLBOT_PRIVATE_BOT_WORKER_IMAGE by digest}
    profiles: ["qqcc-private-bots"]
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/private-bot-worker.env
        required: false
        format: raw
    command: ["python", "-m", "qqcc_private_bot.worker"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/runtime:/app/runtime-flags

  paid-group-guard-bot:
    <<: *app-base
    image: ${ALLBOT_PAID_GROUP_BOT_IMAGE:?release.env must pin ALLBOT_PAID_GROUP_BOT_IMAGE by digest}
    profiles: ["paid-group"]
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/paid-group-bot.env
        required: false
        format: raw
    command: ["python", "-m", "paid_group_guard_bot"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/runtime/paid-group-guard:/app/runtime/paid-group-guard

  group-manage-bot:
    <<: *app-base
    image: ${ALLBOT_GROUP_MANAGE_BOT_IMAGE:?release.env must pin ALLBOT_GROUP_MANAGE_BOT_IMAGE by digest}
    profiles: ["group-manage"]
    env_file:
      - path: ${ALLBOT_SERVICE_ENV_ROOT:?ALLBOT_SERVICE_ENV_ROOT is required}/group-manage-bot.env
        required: false
        format: raw
    command: ["python", "-m", "standalone_group_manage_bot"]
    volumes:
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/logs:/app/logs
      - ${ALLBOT_STATE_ROOT:?ALLBOT_STATE_ROOT is required}/runtime/group-manage:/app/runtime/group-manage
