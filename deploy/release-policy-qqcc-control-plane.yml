{
  "schema_version": 1,
  "all_services": [
    "central-api",
    "qqcc-bot",
    "qqcc-config-backend",
    "qqcc-config-frontend",
    "qqcc-private-bot-worker"
  ],
  "level_order": ["none", "rolling", "drain", "maintenance"],
  "unknown": {
    "level": "maintenance",
    "services": "all"
  },
  "rules": [
    {
      "name": "qqcc-central-contract",
      "patterns": [
        "backend/app/models.py",
        "src/core/task_dispatcher.py",
        "src/services/task_service_entrypoints_specialized.py"
      ],
      "level": "rolling",
      "services": ["central-api"]
    },
    {
      "name": "qqcc-shared-runtime",
      "patterns": [
        "src/api_client.py",
        "src/handlers/fsm/quick_video_callback_data.py",
        "src/handlers/fsm/quick_video_fsm.py",
        "src/handlers/menu_route_registry.py",
        "src/lora_catalog.py",
        "src/services/image_service.py",
        "src/services/private_qqcc_bot_management.py",
        "src/services/private_qqcc_bot_service.py",
        "src/services/private_qqcc_continuation_service.py",
        "src/services/qqcc_config_service.py",
        "src/services/qqcc_demo_generation_service.py",
        "src/services/qqcc_demo_media_service.py",
        "src/services/qqcc_regeneration_service.py",
        "src/services/quick_video_submission_service.py",
        "src/services/tg_task_result_presentation.py"
      ],
      "level": "rolling",
      "services": [
        "central-api",
        "qqcc-bot",
        "qqcc-config-backend",
        "qqcc-private-bot-worker"
      ]
    },
    {
      "name": "qqcc-bot-runtime",
      "patterns": ["qqcc_bot/**", "shared/locales/*.json"],
      "level": "rolling",
      "services": ["qqcc-bot", "qqcc-private-bot-worker"]
    },
    {
      "name": "qqcc-config-backend",
      "patterns": ["dashboard/backend/schemas.py"],
      "level": "rolling",
      "services": ["qqcc-config-backend"]
    },
    {
      "name": "qqcc-config-frontend",
      "patterns": [
        "dashboard/frontend/src/api/privateBotOwnerApi.ts",
        "dashboard/frontend/src/api/qqccConfigApi.ts",
        "dashboard/frontend/src/components/QqccBotSettings.test.ts",
        "dashboard/frontend/src/components/QqccBotSettings.vue"
      ],
      "level": "rolling",
      "services": ["qqcc-config-frontend"]
    },
    {
      "name": "qqcc-release-metadata",
      "patterns": [
        ".codex/skills/**",
        "deploy/release-policy*.yml",
        "docs/**",
        "scripts/release.py",
        "tests/**"
      ],
      "level": "none",
      "services": []
    }
  ]
}
