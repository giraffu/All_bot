services:
  prompt-optimizer-worker:
    image: ${ALLBOT_PROMPT_OPTIMIZER_IMAGE:?exact digest-pinned image is required}
    container_name: allbot-prompt-optimizer-test
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${ALLBOT_PROMPT_OPTIMIZER_ENV_FILE:?environment file is required}
    environment:
      MASTER_API_URL: ${PROMPT_OPTIMIZER_RELAY_URL:-http://127.0.0.1:8096}
      LM_STUDIO_BASE_URL: http://127.0.0.1:1234
      LM_STUDIO_MODEL: ltx-prompt-optimizer
      PROMPT_OPTIMIZER_HEALTH_PORT: "8097"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/ready', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 20s

