x-worker-cloud-env: &worker-cloud-env
  TZ: Asia/Shanghai
  MASTER_API_URL: http://127.0.0.1:${CLOUD_TEST_LOCAL_RELAY_PORT:-8014}
  AGENT_SECRET_TOKEN: ${AGENT_SECRET_TOKEN:?AGENT_SECRET_TOKEN is required}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  MINIO_INPUT_BUCKET: ${MINIO_INPUT_BUCKET:-bot-data-test}
  MINIO_RESULT_BUCKET: ${MINIO_RESULT_BUCKET:-comfyui-temp-test}
  MINIO_TEMPLATE_BUCKET: ${MINIO_TEMPLATE_BUCKET:-bot-template-test}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  UPLOAD_SIDECAR_URL: http://127.0.0.1:${CLOUD_TEST_LOCAL_RELAY_PORT:-8014}
  RESULT_SPOOL_DIR: /app/spool
  PREFETCH_ENABLED: ${PREFETCH_ENABLED:-true}
  PREFETCH_DEPTH: ${PREFETCH_DEPTH:-1}
  PREFETCH_TASK_TYPES: ${PREFETCH_TASK_TYPES:-img2img,img2img_lora,face_swap,i2i_draw,i2i_pro}
  PREFETCH_CACHE_DIR: /app/prefetch-cache
  PIPELINE_ENABLED: ${PIPELINE_ENABLED:-true}
  PIPELINE_MAX_RUNNING_TASKS: ${PIPELINE_MAX_RUNNING_TASKS:-2}
  PIPELINE_TASK_TYPES: ${PIPELINE_TASK_TYPES:-all}
  CANCEL_LOCK_ON_POP: ${CANCEL_LOCK_ON_POP:-true}

x-worker-base-cloud-test: &worker-base-cloud-test
  build:
    context: ./
    dockerfile: Dockerfile
  restart: always
  depends_on:
    - cloud-worker-relay-test
  env_file:
    - ../.env.cloud.test
  network_mode: "host"
  volumes:
    - ../logs/workers-cloud-test:/app/logs
    - ../logs/worker-spool-cloud-test:/app/spool
    - ./comfy_agent/workflows:/app/worker/workflows
    - ../src:/app/src

services:
  cloud-worker-relay-test:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: cloud-worker-relay-test
    restart: always
    env_file:
      - ../.env.cloud.test
    network_mode: "host"
    command: ["python", "/app/local_relay/relay_main.py"]
    environment:
      <<: *worker-cloud-env
      CENTRAL_API_URL: http://${CLOUD_TEST_CONTROL_HOST:?CLOUD_TEST_CONTROL_HOST is required}:8004
      LOCAL_RELAY_HOST: 127.0.0.1
      LOCAL_RELAY_PORT: ${CLOUD_TEST_LOCAL_RELAY_PORT:-8014}
      RESULT_SPOOL_DIR: /app/spool
    volumes:
      - ../logs/workers-cloud-test:/app/logs
      - ../logs/worker-spool-cloud-test:/app/spool

  cloud-comfy-agent-test-1:
    <<: *worker-base-cloud-test
    container_name: cloud-comfy-agent-test-1
    environment:
      <<: *worker-cloud-env
      AGENT_ID: cloud_worker_test_01
      POOL_MANAGED: "true"
      POOL_PROVIDER: lan_ssh
      POOL_NODE_ID: ${CLOUD_TEST_WORKER_01_NODE_ID:-gpu-252}
      POOL_GPU_INDEX: ${CLOUD_TEST_WORKER_01_GPU_INDEX:-0}
      POOL_RUNTIME_PROFILE: ${CLOUD_TEST_WORKER_01_RUNTIME_PROFILE:-i2i_pro}
      SUPPORTED_TASK_TYPES: ${CLOUD_TEST_WORKER_01_TASK_TYPES:-face_swap,i2i_pro,i2i_draw,t2i-pornmaster-turbo}
      TASK_TYPE_WORKFLOW_OVERRIDES: ${CLOUD_TEST_WORKER_01_TASK_TYPE_WORKFLOW_OVERRIDES:-}
      COMFY_API_URL: ${CLOUD_TEST_WORKER_01_COMFY_API_URL:-http://192.168.1.252:8192}
      COMFY_WS_URL: ${CLOUD_TEST_WORKER_01_COMFY_WS_URL:-ws://192.168.1.252:8192/ws}
      COMFY_INPUT_DIR: /tmp/input
      COMFY_OUTPUT_DIR: /tmp/output

  cloud-comfy-agent-test-2:
    <<: *worker-base-cloud-test
    container_name: cloud-comfy-agent-test-2
    profiles:
      - shared-aio-canary
    restart: "no"
    environment:
      <<: *worker-cloud-env
      AGENT_ID: cloud_worker_test_02
      POOL_MANAGED: "true"
      POOL_PROVIDER: lan_ssh
      POOL_NODE_ID: gpu-177
      POOL_GPU_INDEX: "0"
      POOL_RUNTIME_PROFILE: ${CLOUD_TEST_WORKER_02_RUNTIME_PROFILE:-wan22_video_v2}
      PREFETCH_ENABLED: ${CLOUD_TEST_SHARED_AIO_PREFETCH_ENABLED:-false}
      PIPELINE_ENABLED: ${CLOUD_TEST_SHARED_AIO_PIPELINE_ENABLED:-false}
      PIPELINE_MAX_RUNNING_TASKS: ${CLOUD_TEST_SHARED_AIO_PIPELINE_MAX_RUNNING_TASKS:-1}
      SUPPORTED_TASK_TYPES: ${CLOUD_TEST_WORKER_02_TASK_TYPES:-wan22_video_v2}
      COMFY_API_URL: ${CLOUD_TEST_WORKER_02_COMFY_API_URL:-http://192.168.1.177:8190}
      COMFY_WS_URL: ${CLOUD_TEST_WORKER_02_COMFY_WS_URL:-ws://192.168.1.177:8190/ws}
