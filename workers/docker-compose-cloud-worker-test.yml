x-worker-cloud-env: &worker-cloud-env
  TZ: Asia/Shanghai
  MASTER_API_URL: http://${CLOUD_TEST_TAILSCALE_IP:?CLOUD_TEST_TAILSCALE_IP is required}:8004
  AGENT_SECRET_TOKEN: ${AGENT_SECRET_TOKEN:?AGENT_SECRET_TOKEN is required}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  MINIO_INPUT_BUCKET: ${MINIO_INPUT_BUCKET:-bot-data-test}
  MINIO_RESULT_BUCKET: ${MINIO_RESULT_BUCKET:-comfyui-temp-test}
  MINIO_TEMPLATE_BUCKET: ${MINIO_TEMPLATE_BUCKET:-bot-template-test}
  MINIO_SECURE: ${MINIO_SECURE:-false}

x-worker-base-cloud-test: &worker-base-cloud-test
  build:
    context: ./
    dockerfile: Dockerfile
  restart: always
  env_file:
    - ../.env.cloud.test
  network_mode: "host"
  volumes:
    - ../logs/workers-cloud-test:/app/logs
    - ./comfy_agent/workflows:/app/worker/workflows
    - ../src:/app/src

services:
  cloud-comfy-agent-test-1:
    <<: *worker-base-cloud-test
    container_name: cloud-comfy-agent-test-1
    environment:
      <<: *worker-cloud-env
      AGENT_ID: cloud_worker_test_01
      SUPPORTED_TASK_TYPES: face_swap,i2i_pro,i2i_draw,face_video,image_to_video,t2i-pornmaster-turbo
      COMFY_API_URL: http://192.168.1.226:8188
      COMFY_WS_URL: ws://192.168.1.226:8188/ws
      COMFY_INPUT_DIR: /tmp/input
      COMFY_OUTPUT_DIR: /tmp/output

  cloud-comfy-agent-test-2:
    <<: *worker-base-cloud-test
    container_name: cloud-comfy-agent-test-2
    environment:
      <<: *worker-cloud-env
      AGENT_ID: cloud_worker_test_02
