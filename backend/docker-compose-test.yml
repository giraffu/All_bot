version: '3.8'

services:
  api-test:
    build: .
    container_name: central-api-test
    ports:
      - "8004:8003"
    env_file:
      - ../.env.test
    environment:
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://:redispassword@host.docker.internal:6379/4
    volumes:
      - ../workers/comfy_agent/workflows:/app/workflows
      - ./app:/app/app
      - ../src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
