version: '3.8'

services:
  api:
    build: .
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://:redispassword@host.docker.internal:6379/2
      - AUTH_TOKEN=your_secure_token_here
      - MINIO_ENDPOINT=host.docker.internal:9000
      - MINIO_ACCESS_KEY=chuzeyu
      - MINIO_SECRET_KEY=@Cv1347968277
      - MINIO_BUCKET=bot-data
      - MINIO_INPUT_BUCKET=comfyui-input
      - MINIO_RESULT_BUCKET=${MINIO_RESULT_BUCKET:-comfyui-temp}
      - MINIO_TEMPLATE_BUCKET=bot-template
      - MINIO_SECURE=false
      - AGENT_SECRET_TOKEN=${AGENT_SECRET_TOKEN:-super_secret_agent_token_2026}
    volumes:
      - ./app:/app/app
      - ../src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
