version: '3.8'

services:
  api:
    build: .
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - AUTH_TOKEN=${AUTH_TOKEN:?AUTH_TOKEN is required}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - MINIO_RESULT_BUCKET=${MINIO_RESULT_BUCKET:?MINIO_RESULT_BUCKET is required}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - LEGACY_RESULT_COMPLETION_ENABLED=${LEGACY_RESULT_COMPLETION_ENABLED:-true}
      - AGENT_SECRET_TOKEN=${AGENT_SECRET_TOKEN:?AGENT_SECRET_TOKEN is required}
    volumes:
      - ./app:/app/app
      - ../src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
