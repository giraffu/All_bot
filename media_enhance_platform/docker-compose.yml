name: clarity-ai-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clarity
      POSTGRES_USER: clarity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - clarity_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarity -d clarity"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - clarity_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      CLARITY_ENVIRONMENT: local
      CLARITY_DATABASE_URL: postgresql+asyncpg://clarity:${POSTGRES_PASSWORD}@postgres:5432/clarity
      CLARITY_JWT_SECRET: ${CLARITY_JWT_SECRET}
      CLARITY_AGENT_TOKEN: ${CLARITY_AGENT_TOKEN}
      CLARITY_ADMIN_EMAIL: ${CLARITY_ADMIN_EMAIL}
      CLARITY_ADMIN_PASSWORD: ${CLARITY_ADMIN_PASSWORD}
      CLARITY_STORAGE_BACKEND: s3
      CLARITY_S3_ENDPOINT_URL: http://minio:9000
      CLARITY_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      CLARITY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CLARITY_S3_BUCKET: clarity-media
      CLARITY_ALLOWED_ORIGINS: '${CLARITY_ALLOWED_ORIGINS:?set CLARITY_ALLOWED_ORIGINS to a JSON origin allowlist}'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:${CLARITY_WEB_PORT:-8095}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clarity_postgres:
  clarity_minio:
